services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "8081:8080"
    environment:
      JWT_SECRET: sso-poc-jwt-secret-change-me
      DATABASE_URL: postgresql://openpeeps:openpeeps@postgres:5432/openpeeps
      REDIS_HOST: 172.20.0.2
      REDIS_PORT: "6379"
      ORIGIN: http://192.168.168.113:8081
    networks:
      - sso

networks:
  sso:
    name: sso-poc_default
    external: true
