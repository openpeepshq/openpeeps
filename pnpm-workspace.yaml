packages:
  - "libraries/*"
  - "platform/*"
  - "examples/*"
  - "plugins/*/*"
  - "docs-site"

linkWorkspacePackages: deep

overrides:
  "@types/react": "19.2.14"
  "@types/react-dom": "19.2.3"
  "@tanstack/react-query": "5.90.16"
  react: "19.2.6"
  react-dom: "19.2.6"
  # icon-set-creator pins sharp@0.30.7; its prebuild often times out in CI and
  # then node-gyp fails (no make). Force the same sharp used by core/server.
  sharp: "0.33.5"
  # mermaid pulls dompurify ^3.3.3 which resolved to vulnerable 3.4.15
  # (GHSA-cg2g-xh64-v4q7 + others). Force the patched 3.4.17 tree-wide.
  dompurify: "3.4.17"
  # apns2 (platform/core) pulls fast-jwt 6.0.2 with 3 critical JWT-auth
  # bypasses (GHSA-mvf2 / GHSA-rp9m / GHSA-gmvf) + 7 more. Force patched 6.3.6
  # tree-wide; apns2 allows ^6.0.1 so the override stays inside its range.
  fast-jwt: "6.3.6"

allowBuilds:
  "@evilmartians/lefthook": true
  "@firebase/util": true
  "@sentry/cli": true
  bcrypt: true
  canvas: true
  core-js: true
  core-js-pure: true
  esbuild: true
  hyochan-welcome: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  web-audio-api: true

minimumReleaseAgeExclude:
  - livekit-client@2.19.2
  - '@riddl/core'
