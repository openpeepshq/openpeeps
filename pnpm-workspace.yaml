packages:
  - "libraries/*"
  - "platform/*"
  - "examples/*"
  - "plugins/*/*"
  - "docs-site"

linkWorkspacePackages: deep

overrides:
  # faye-websocket@0.11.4 (pulled by @firebase/database via firebase-admin /
  # @react-native-firebase) declares websocket-driver >=0.5.1, which resolved
  # to 0.7.4 (GHSA-xv26-6w52-cph6 critical, GHSA-mp7j-qc5w-4988 moderate,
  # both fixed in 0.7.5). Force the patched 0.7.5 — in-range, no direct-dep
  # bump path exists.
  faye-websocket>websocket-driver: "0.7.5"
  "@types/react": "19.2.14"
  react: "19.2.6"
  react-dom: "19.2.6"
  # icon-set-creator pins sharp@0.30.7; its prebuild often times out in CI and
  # then node-gyp fails (no make). Force the same sharp used by core/server.
  # Bump to 0.35.5 clears the libvips/libheif/librsvg advisories.
  sharp: "0.35.5"
  # express 5.x allows proxy-addr ^2.0.7; 2.0.7 has an IP-spoofing
  # bug via IPv4-mapped IPv6 trust subnet (GHSA-jqcg). Force the patched 2.0.8.
  proxy-addr: "2.0.8"
  # get-uri (dev-only release tooling: release-it -> proxy-agent) pulls basic-ftp
  # ^5.0.2 which resolved to vulnerable 5.0.5 (GHSA-5rq4-664w-9x2c path traversal,
  # plus 3 high DoS/CRLF). A scoped 5.3.1 override (PR #2042) cleared those four;
  # three more advisories remained: GHSA-x4x7-3x4q-92vw-class high (<=6.2.0,
  # patched 6.2.1), GHSA-pm4q-ghxj-9g3c + GHSA-8q9c-4w5r-7v2d moderate (patched
  # 6.2.3/6.2.4). Force tree-wide basic-ftp 6.2.6 (latest 6.x) — this crosses the
  # consumer's declared ^5.0.2 major range; basic-ftp is only used by get-uri in
  # dev-only release tooling (release-it -> proxy-agent), never shipped at
  # runtime, so the 5 -> 6 jump carries no production risk.
  basic-ftp: "6.2.6"
  # jsdom (vitest/jsdom dev trees) pulls form-data ^4.0.0 which resolved to
  # vulnerable 4.0.0 (GHSA-fjxv-7rqg-78g4 unsafe-random boundary,
  # GHSA-hmw2-7cc7-3qxx CRLF injection). Force the patched 4.0.6 for the jsdom
  # instances only; both jsdom 24/25 declare ^4.0.0 so this stays in-range.
  "jsdom>form-data": "4.0.6"
  # shell-quote 1.8.3 (via launch-editor@2.9.1 <- @react-native-community/cli-doctor,
  # and react-devtools-core@6.1.5 — both dev tooling) carries 2 critical advisories:
  # quote() newline-injection in object .op values (all <=1.8.3, patched 1.8.4) and
  # quadratic-complexity parse() DoS (<=1.8.4, patched 1.8.5). The consumers' ranges
  # are loose, so a tree-wide override to 1.12.0 (latest; already resolved for
  # concurrently) is safe — shell-quote's API is stable and these consumers are
  # dev-only.
  shell-quote: "1.12.0"
  # --- Wave-3 in-range patch sweep: overrides for vulnerable transitive
  # versions whose parent ranges already allow the patched release (all
  # patch/minor-level, mostly dev tooling) ---

  # brace-expansion: ReDoS family (18 advisories, patched >=1.1.12/1.1.21,
  # >=2.1.5/2.1.7, >=5.0.6/5.0.12). Consumers are minimatch@3/8/9 (majors 1/2)
  # and minimatch@10.2.5 (major 5); all declare caret ranges, so pinning the
  # latest of each major stays in-range.
  "brace-expansion@1": "1.1.22"
  "brace-expansion@2": "2.1.8"
  "brace-expansion@>=3 <5": "5.0.13"
  # js-yaml: prototype-pollution / input-validation family (10 advisories,
  # patched >=3.14.2 and >=4.1.2..4.3.2). Consumers: cosmiconfig@5 (3.x line)
  # and cosmiconfig@8/9 + @istanbuljs/load-nyc-config (4.x line) — all caret.
  "js-yaml@<4": "3.15.2"
  "js-yaml@>=4": "4.3.2"
  # minimatch: ReDoS family (10 advisories, patched >=3.1.4, >=8.0.6, >=9.0.7,
  # and >=11.0.1 for the 7.x-10.x line — so pin 11.x for those consumers,
  # in-range via their loose carets).
  "minimatch@<7": "3.1.5"
  "minimatch@>=7 <9": "8.0.7"
  "minimatch@>=9 <11": "9.0.9"
  "minimatch@>=11": "11.0.8"
  # fast-uri: 10 advisories (patched >=3.1.9), only consumer ajv@8.20.0 (^3.0.1).
  "fast-uri@<4": "3.1.9"
  # hono: 10 advisories (patched >=4.13.16), consumers @modelcontextprotocol/node
  # (^4.11.4) and @hono/node-server (^4).
  "hono@<5": "4.13.18"
  # joi: 6 advisories (patched >=17.13.9), consumers RN CLI config/types and
  # @hookform/resolvers (^17.2.1).
  "joi@<18": "17.13.9"
  # ws: DoS family (4 advisories, patched >=6.2.4, >=7.5.11, >=8.21.0).
  # Consumers: @react-native-community/cli-server-api (6.x), metro/RN
  # dev-middleware/react-devtools-core (7.x), jsdom (8.x).
  "ws@<7": "6.2.4"
  "ws@>=7 <8": "7.5.11"
  "ws@>=8": "8.21.0"
  # qs: 6 advisories (patched >=6.16.1). Consumers: stripe@18.4.0 (^6.11.0),
  # express@5.2.1 / body-parser@2.2.2 (^6.14.0+).
  "qs@<7": "6.16.1"
  # undici is pulled in by @sentry/cli (6.25.0), @digitalbazaar/http-client
  # (6.29.1), apns2 (7.10.0) and @fedify/vocab-runtime (7.30.1). The 6.x lines
  # are end-of-life; 7.30.1 still carries CVE-2025-7783 (HTTP/2 Rapid Reset,
  # fixed in 7.30.2). Force 7.30.2 tree-wide. This crosses the 6.x->7.x major
  # boundary for the two 6.x consumers (declared ^6.22.0 / ^6.28.0); undici's
  # public fetch API is stable across the major, so the risk is low.
  undici: "7.30.2"
  # handlebars 4.7.9 (via ts-jest 29.4.9 and
  # @release-it/conventional-changelog > conventional-changelog-writer 8.0.0,
  # both dev tooling) has 2 critical JS-injection advisories (GHSA-8r5x-fm3f-whwj,
  # GHSA-p8wg-vrv2-v86f) + 1 moderate, all fixed in 4.7.10. Both parents' caret
  # ranges (^4.7.9 / ^4.7.7) already allow 4.7.10; the lockfile is stale.
  # Patch-level, dev-only.
  handlebars: "4.7.10"
  # form-data 2.5.3 (pulled by @types/request via retry-request /
  # google-gax / firebase-admin chain in platform/core) carries 2 advisories:
  # GHSA-fjxv-7rqg-78g4 (critical, unsafe random in boundary selection, >=2.5.4)
  # and GHSA-hmw2-7cc7-3qxx (high, CRLF injection via unescaped multipart fields,
  # >=2.5.6). Force 2.5.6 — in-range for @types/request's ^2.5.0 peer. Scoped
  # override via @types/request>form-data keeps it from affecting the jsdom
  # form-data@4.0.0 instance.
  "@types/request>form-data": "2.5.6"
  # zod@4.4.3 carries GHSA-mrhx-c7xc-m3w5 (high, CVSS 7.5): memory exhaustion
  # while validating oversized constrained collections. Force 4.6.7 — first
  # patched version is 4.6.6; using 4.6.7 for an extra safety margin.
  zod: "4.6.7"
  # fast-xml-parser 4.5.1 (via firebase-admin > @google-cloud/storage@7.16.0)
  # carries 7 advisories; the scoped override below clears 5 (1 critical, 2 high,
  # 1 moderate, 1 low) by bumping to 4.5.7. The 2 remaining (GHSA-gh4j-gqv2-49f6,
  # GHSA-474x-hrwr-fgx4) require 5.x and stay after this change.
  # @google-cloud/storage@7.16.0 declares fast-xml-parser ^4.4.1, so 4.5.7 is
  # in-range — no cross-major jump. The other resolved instance (5.7.1 via RN CLI)
  # is untouched by this scoped override.
  '@google-cloud/storage>fast-xml-parser': "4.5.7"
  # @grpc/proto-loader / @google-cloud/firestore / google-gax / proto3-json-serializer
  # all declare protobufjs ^7.x. 7.5.3 carries 13 advisories (1 critical, 5 high,
  # 6 moderate, plus 1 moderate on the @protobufjs/utf8 sub-package) all patched
  # by <=7.6.5; 7.6.6 is the latest 7.x and keeps the same @protobufjs/* ranges.
  protobufjs: "7.6.6"
  # tar 6.2.1 (via node-pre-gyp > bcrypt) carries 12 advisories
  # (1 critical decompression DoS GHSA-23hp, 8 high path-traversal/file-creation,
  # 3 moderate PAX size-override/numeric path/NUL-byte DoS). Force 7.5.22 tree-wide;
  # tar is install-time tooling only, not production runtime.
  tar: "7.5.22"
  # node-forge 1.3.1 (transitive via firebase-admin ^1.3.1) carries the
  # node-forge advisory backlog — 28 advisories (14 high / 8 moderate / 6 low
  # per pnpm audit, as of 2026-11-14) — all cleared by 1.4.3 (latest 1.x,
  # published 2026-11-04). GHSA IDs with 1.4.3 as first-patched:
  # GHSA-6889-vf6x-f3g5, GHSA-w4xr-hqv8-ch44, GHSA-6cv4-p8m7-4r25,
  # GHSA-j8rw-jp99-435v. 1.4.3 is inside ^1.3.1 — in-range bump.
  # Note: pinned to exact 1.4.3; node-forge has a sustained advisory stream,
  # so each new security release requires a follow-up override bump.
  node-forge: "1.4.3"
  # fast-jwt 6.0.2 (pulled in by apns2, ^6.0.1 declared) carries multiple
  # GHSA advisories (3 critical as of 2026-11). 6.3.6 clears all of them
  # (one — GHSA-hm7r-c7qw-ghp6 — has no patched release; cleared by range
  # since 6.3.6 > the advisory's <=6.1.0 ceiling) and sits inside apns2's
  # declared range. (fast-jwt@6.3.6 requires node >=20, which matches CI's
  # node:24-alpine base image.)
  fast-jwt: "6.3.6"
  # jsonpath@1.3.0 pulls underscore@1.13.6 which is HIGH-severity vulnerable
  # (GHSA-qpx9-hpmf-5gmw — unlimited recursion in _.flatten/_.isEqual). Force
  # 1.13.8 tree-wide to clear the remaining advisory from this jsonpath bump.
  underscore: "1.13.8"

allowBuilds:
  "@evilmartians/lefthook": true
  "@firebase/util": true
  "@sentry/cli": true
  bcrypt: true
  canvas: true
  core-js: true
  core-js-pure: true
  esbuild: true
  hyochan-welcome: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  web-audio-api: true

minimumReleaseAgeExclude:
  - livekit-client@2.19.2
  - '@riddl/core'
