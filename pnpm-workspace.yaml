packages:
  - "libraries/*"
  - "platform/*"
  - "examples/*"
  - "plugins/*/*"

linkWorkspacePackages: deep

overrides:
  "@types/react": "19.2.14"
  "@types/react-dom": "19.2.3"
  "@tanstack/react-query": "5.90.16"
  react: "19.2.6"
  react-dom: "19.2.6"
  # icon-set-creator pins sharp@0.30.7; its prebuild often times out in CI and
  # then node-gyp fails (no make). Force the same sharp used by core/server.
  sharp: "0.33.5"

allowBuilds:
  "@evilmartians/lefthook": true
  "@firebase/util": true
  "@sentry/cli": true
  bcrypt: true
  canvas: true
  core-js: true
  core-js-pure: true
  esbuild: true
  hyochan-welcome: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  web-audio-api: true

minimumReleaseAgeExclude:
  - livekit-client@2.19.2
  - '@riddl/core'
