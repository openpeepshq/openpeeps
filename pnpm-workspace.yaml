packages:
  - "libraries/*"
  - "platform/*"
  - "examples/*"
  - "plugins/*/*"
  - "docs-site"

linkWorkspacePackages: deep

overrides:
  # faye-websocket@0.11.4 (pulled by @firebase/database via firebase-admin /
  # @react-native-firebase) declares websocket-driver >=0.5.1, which resolved
  # to 0.7.4 (GHSA-xv26-6w52-cph6 critical, GHSA-mp7j-qc5w-4988 moderate,
  # both fixed in 0.7.5). Force the patched 0.7.5 — in-range, no direct-dep
  # bump path exists.
  faye-websocket>websocket-driver: "0.7.5"
  "@types/react": "19.2.14"
  "@types/react-dom": "19.2.3"
  "@tanstack/react-query": "5.90.16"
  react: "19.2.6"
  react-dom: "19.2.6"
  # icon-set-creator pins sharp@0.30.7; its prebuild often times out in CI and
  # then node-gyp fails (no make). Force the same sharp used by core/server.
  # Bump to 0.35.5 clears the libvips/libheif/librsvg advisories.
  sharp: "0.35.5"
  # mermaid pulls dompurify ^3.3.3 which resolved to vulnerable 3.4.15
  # (GHSA-cg2g-xh64-v4q7 + others). Force the patched 3.4.17 tree-wide.
  dompurify: "3.4.17"
  # express 5.x allows proxy-addr ^2.0.7; 2.0.7 has an IP-spoofing
  # bug via IPv4-mapped IPv6 trust subnet (GHSA-jqcg). Force the patched 2.0.8.
  proxy-addr: "2.0.8"
  # undici is pulled in by @sentry/cli (6.25.0), @digitalbazaar/http-client
  # (6.29.1), apns2 (7.10.0) and @fedify/vocab-runtime (7.30.1). The 6.x lines
  # are end-of-life; 7.30.1 still carries CVE-2025-7783 (HTTP/2 Rapid Reset,
  # fixed in 7.30.2). Force 7.30.2 tree-wide. This crosses the 6.x->7.x major
  # boundary for the two 6.x consumers (declared ^6.22.0 / ^6.28.0); undici's
  # public fetch API is stable across the major, so the risk is low.
  undici: "7.30.2"
  # handlebars 4.7.9 (via ts-jest 29.4.9 and
  # @release-it/conventional-changelog > conventional-changelog-writer 8.0.0,
  # both dev tooling) has 2 critical JS-injection advisories (GHSA-8r5x-fm3f-whwj,
  # GHSA-p8wg-vrv2-v86f) + 1 moderate, all fixed in 4.7.10. Both parents' caret
  # ranges (^4.7.9 / ^4.7.7) already allow 4.7.10; the lockfile is stale.
  # Patch-level, dev-only.
  handlebars: "4.7.10"
  # node-forge 1.3.1 (transitive via firebase-admin ^1.3.1) carries 19
  # GHSA advisories (12 high / 4 moderate / 3 low per pnpm audit as of
  # 2026-11-14), all cleared by 1.4.3 (latest 1.x, published 2026-11-04).
  # GHSA IDs with 1.4.3 as first-patched:
  # GHSA-6889-vf6x-f3g5, GHSA-w4xr-hqv8-ch44, GHSA-6cv4-p8m7-4r25,
  # GHSA-j8rw-jp99-435v. 1.4.3 is inside ^1.3.1 — in-range bump.
  # Note: advisory count is point-in-time; new reports may require a follow-up.
  node-forge: "1.4.3"

allowBuilds:
  "@evilmartians/lefthook": true
  "@firebase/util": true
  "@sentry/cli": true
  bcrypt: true
  canvas: true
  core-js: true
  core-js-pure: true
  esbuild: true
  hyochan-welcome: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  web-audio-api: true

minimumReleaseAgeExclude:
  - livekit-client@2.19.2
  - '@riddl/core'
