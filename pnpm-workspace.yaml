packages:
  - "libraries/*"
  - "platform/*"
  - "examples/*"
  - "plugins/*/*"
  - "docs-site"

linkWorkspacePackages: deep

overrides:
  # eslint and vite declare jiti only as an optional peer. With release-it@19's
  # c12@3 (whose config loader hard-depends on jiti ^2 — it calls createJiti,
  # which jiti 1 does not export) in the tree, pnpm's shared peer resolution
  # jumped every eslint/vite instance from main's jiti 1.21.7 to jiti 2.7.0.
  # Scope those peers back to the version main ships so the re-key stays
  # confined to the dev-only release-it -> c12 release tooling subtree, which
  # keeps its own jiti@2.
  "eslint>jiti": "1.21.7"
  "vite>jiti": "1.21.7"
  # faye-websocket@0.11.4 (pulled by @firebase/database via firebase-admin /
  # @react-native-firebase) declares websocket-driver >=0.5.1, which resolved
  # to 0.7.4 (GHSA-xv26-6w52-cph6 critical, GHSA-mp7j-qc5w-4988 moderate,
  # both fixed in 0.7.5). Force the patched 0.7.5 — in-range, no direct-dep
  # bump path exists.
  faye-websocket>websocket-driver: "0.7.5"
  "@types/react": "19.2.14"
  react: "19.2.6"
  react-dom: "19.2.6"
  # icon-set-creator pins sharp@0.30.7; its prebuild often times out in CI and
  # then node-gyp fails (no make). Force the same sharp used by core/server.
  # Bump to 0.35.5 clears the libvips/libheif/librsvg advisories.
  sharp: "0.35.5"
  # express 5.x allows proxy-addr ^2.0.7; 2.0.7 has an IP-spoofing
  # bug via IPv4-mapped IPv6 trust subnet (GHSA-jqcg). Force the patched 2.0.8.
  proxy-addr: "2.0.8"
  # get-uri (dev-only release tooling: release-it -> proxy-agent) pulls basic-ftp
  # ^5.0.2 which resolved to vulnerable 5.0.5 (GHSA-5rq4-664w-9x2c path traversal,
  # plus 3 high DoS/CRLF). A scoped 5.3.1 override (PR #2042) cleared those four;
  # three more advisories remained: GHSA-x4x7-3x4q-92vw-class high (<=6.2.0,
  # patched 6.2.1), GHSA-pm4q-ghxj-9g3c + GHSA-8q9c-4w5r-7v2d moderate (patched
  # 6.2.3/6.2.4). Force tree-wide basic-ftp 6.2.6 (latest 6.x) — this crosses the
  # consumer's declared ^5.0.2 major range; basic-ftp is only used by get-uri in
  # dev-only release tooling (release-it -> proxy-agent), never shipped at
  # runtime, so the 5 -> 6 jump carries no production risk.
  basic-ftp: "6.2.6"
  # jsdom (vitest/jsdom dev trees) pulls form-data ^4.0.0 which resolved to
  # vulnerable 4.0.0 (GHSA-fjxv-7rqg-78g4 unsafe-random boundary,
  # GHSA-hmw2-7cc7-3qxx CRLF injection). Force the patched 4.0.6 for the jsdom
  # instances only; both jsdom 24/25 declare ^4.0.0 so this stays in-range.
  "jsdom>form-data": "4.0.6"
  # shell-quote 1.8.3 (via launch-editor@2.9.1 <- @react-native-community/cli-doctor,
  # and react-devtools-core@6.1.5 — both dev tooling) carries 2 critical advisories:
  # quote() newline-injection in object .op values (all <=1.8.3, patched 1.8.4) and
  # quadratic-complexity parse() DoS (<=1.8.4, patched 1.8.5). The consumers' ranges
  # are loose, so a tree-wide override to 1.12.0 (latest; already resolved for
  # concurrently) is safe — shell-quote's API is stable and these consumers are
  # dev-only.
  shell-quote: "1.12.0"
  # --- Wave-3 in-range patch sweep: overrides for vulnerable transitive
  # versions whose parent ranges already allow the patched release (all
  # patch/minor-level, mostly dev tooling) ---

  # brace-expansion: ReDoS family (18 advisories, patched >=1.1.12/1.1.21,
  # >=2.1.5/2.1.7, >=5.0.6/5.0.12). In-tree consumers after the minimatch
  # sweep below: minimatch@3.1.5 (major 1, declares ^1.1.7) and minimatch
  # 11.x (major 5, declares ^5.0.12) — both caret, so pinning the latest of
  # each major stays in-range. The 2.x pin's only consumers (minimatch 8/9)
  # left the tree with the sweep; it stays so a future 2.x resolution cannot
  # re-introduce a vulnerable release.
  "brace-expansion@1": "1.1.22"
  "brace-expansion@2": "2.1.8"
  "brace-expansion@>=3 <5": "5.0.13"
  # js-yaml: prototype-pollution / input-validation family (10 advisories,
  # patched >=3.14.2 and >=4.1.2..4.3.2). Consumers: cosmiconfig@5 (3.x line)
  # and cosmiconfig@8/9 + @istanbuljs/load-nyc-config (4.x line) — all caret.
  "js-yaml@<4": "3.15.2"
  "js-yaml@>=4": "4.3.2"
  # minimatch: two advisory families. ReDoS (patched >=3.1.4, >=8.0.6, >=9.0.7)
  # and GHSA-g3hv-75wg-m249 — globparts amplification DoS, vulnerable
  # >=7.0.0 <11.0.1 (moderate; patched 11.0.1). No release in the 7.x-10.x
  # lines is patched, and no affected consumer declares a range that includes
  # 11.x (glob 9: ^8.0.2, glob 10: ^9.0.4, typescript-estree: ^10.2.2,
  # api-extractor: 10.2.3, @vue/language-core: ^9.0.3), so an in-range upgrade
  # is impossible — the cross-major override to the patched line (11.0.9,
  # latest 11.x) is the only tree-wide fix. The earlier 8.0.7/9.0.9 pins were
  # themselves inside the vulnerable range. Consumers are lint/build tooling
  # (glob 9 via babel-plugin-module-resolver, glob 10 via sucrase,
  # typescript-estree, @eslint/config-array, @vue/language-core, api-extractor)
  # plus one runtime-reachable leg — glob 10 via archiver-utils (platform/core
  # uses archiver at runtime) — though minimatch itself never ships in bundles.
  # The 11.x API surface used by those call sites was verified compatible. The
  # 3.x line (consumers glob 7/8, eslint-plugin-react, filelist, readdir-glob,
  # test-exclude) sits below the advisory's >=7 floor and keeps its patched
  # 3.1.5 pin.
  "minimatch@<7": "3.1.5"
  "minimatch@>=7": "11.0.9"
  # fast-uri: 10 advisories (patched >=3.1.9), only consumer ajv@8.20.0 (^3.0.1).
  "fast-uri@<4": "3.1.9"
  # hono: 10 advisories (patched >=4.13.16), consumers @modelcontextprotocol/node
  # (^4.11.4) and @hono/node-server (^4).
  "hono@<5": "4.13.18"
  # joi: 6 advisories (patched >=17.13.9), consumers RN CLI config/types and
  # @hookform/resolvers (^17.2.1).
  "joi@<18": "17.13.9"
  # ws: DoS family (4 advisories, patched >=6.2.4, >=7.5.11, >=8.21.0).
  # Consumers: @react-native-community/cli-server-api (6.x), metro/RN
  # dev-middleware/react-devtools-core (7.x), jsdom (8.x).
  "ws@<7": "6.2.4"
  "ws@>=7 <8": "7.5.11"
  "ws@>=8": "8.21.0"
  # qs: 6 advisories (patched >=6.16.1). Consumers: stripe@18.4.0 (^6.11.0),
  # express@5.2.1 / body-parser@2.2.2 (^6.14.0+).
  "qs@<7": "6.16.1"
  # undici is pulled in by @sentry/cli (6.25.0), @digitalbazaar/http-client
  # (6.29.1), apns2 (7.10.0) and @fedify/vocab-runtime (7.30.1). The 6.x lines
  # are end-of-life; 7.30.1 still carries CVE-2025-7783 (HTTP/2 Rapid Reset,
  # fixed in 7.30.2). Force 7.30.2 tree-wide. This crosses the 6.x->7.x major
  # boundary for the two 6.x consumers (declared ^6.22.0 / ^6.28.0); undici's
  # public fetch API is stable across the major, so the risk is low.
  undici: "7.30.2"
  # handlebars 4.7.9 (via ts-jest 29.4.9 and
  # @release-it/conventional-changelog > conventional-changelog-writer 8.0.0,
  # both dev tooling) has 2 critical JS-injection advisories (GHSA-8r5x-fm3f-whwj,
  # GHSA-p8wg-vrv2-v86f) + 1 moderate, all fixed in 4.7.10. Both parents' caret
  # ranges (^4.7.9 / ^4.7.7) already allow 4.7.10; the lockfile is stale.
  # Patch-level, dev-only.
  handlebars: "4.7.10"
  # form-data 2.5.3 (pulled by @types/request via retry-request /
  # google-gax / firebase-admin chain in platform/core) carries 2 advisories:
  # GHSA-fjxv-7rqg-78g4 (critical, unsafe random in boundary selection, >=2.5.4)
  # and GHSA-hmw2-7cc7-3qxx (high, CRLF injection via unescaped multipart fields,
  # >=2.5.6). Force 2.5.6 — in-range for @types/request's ^2.5.0 peer. Scoped
  # override via @types/request>form-data keeps it from affecting the jsdom
  # form-data@4.0.0 instance.
  "@types/request>form-data": "2.5.6"
  # ical-generator (platform/common) declares moment as an optional peer
  # (>= 2.29.0), and react-native-calendars (platform/rn-components) depends on
  # moment ^2.29.4; the tree-wide hoisted 2.30.1 fills both and carries
  # GHSA-4p3w-j4w9-5jqw (moderate, path traversal via a crafted non-string
  # locale name). Force the patched 2.31.0 tree-wide — in-range for both
  # consumers, no direct-dep bump path exists for the optional-peer leg.
  moment: "2.31.0"
  # zod@4.4.3 carries GHSA-mrhx-c7xc-m3w5 (high, CVSS 7.5): memory exhaustion
  # while validating oversized constrained collections. Force 4.6.7 — first
  # patched version is 4.6.6; using 4.6.7 for an extra safety margin.
  zod: "4.6.7"
  # Tree-wide fast-xml-parser override: 5.12.0 is the first release patched
  # for both advisories that were in play (GHSA-gh4j-gqv2-49f6 — XMLBuilder XML
  # comment/CDATA injection, first-patched 5.7.0; GHSA-474x-hrwr-fgx4 —
  # quadratic CPU DoS, <=5.11.2 vulnerable, fixed 5.12.0); pinned 5.12.1
  # (latest). firebase-admin's @google-cloud/storage leg declares ^5.3.4
  # (in-range, no cross-major jump) and the RN CLI chain declares ^5.3.6, so
  # both legs clear.
  fast-xml-parser: "5.12.1"
  # @grpc/proto-loader / @google-cloud/firestore / google-gax / proto3-json-serializer
  # all declare protobufjs ^7.x. 7.5.3 carries 13 advisories (1 critical, 5 high,
  # 6 moderate, plus 1 moderate on the @protobufjs/utf8 sub-package) all patched
  # by <=7.6.5; 7.6.6 is the latest 7.x and keeps the same @protobufjs/* ranges.
  protobufjs: "7.6.6"
  # tar 6.2.1 (via node-pre-gyp > bcrypt) carries 12 advisories
  # (1 critical decompression DoS GHSA-23hp, 8 high path-traversal/file-creation,
  # 3 moderate PAX size-override/numeric path/NUL-byte DoS). Force 7.5.22 tree-wide;
  # tar is install-time tooling only, not production runtime.
  tar: "7.5.22"
  # fast-jwt 6.0.2 (pulled in by apns2, ^6.0.1 declared) carries multiple
  # GHSA advisories (3 critical as of 2026-11). 6.3.6 clears all of them
  # (one — GHSA-hm7r-c7qw-ghp6 — has no patched release; cleared by range
  # since 6.3.6 > the advisory's <=6.1.0 ceiling) and sits inside apns2's
  # declared range. (fast-jwt@6.3.6 requires node >=20, which matches CI's
  # node:24-alpine base image.)
  fast-jwt: "6.3.6"
  # jsonpath@1.3.0 pulls underscore@1.13.6 which is HIGH-severity vulnerable
  # (GHSA-qpx9-hpmf-5gmw — unlimited recursion in _.flatten/_.isEqual). Force
  # 1.13.8 tree-wide to clear the remaining advisory from this jsonpath bump.
  underscore: "1.13.8"
  # --- Wave-3 dev-tooling override batch: vulnerable transitive deps whose
  # consumers pin majors older than the patched release; all consumers are
  # dev tooling or server-side, none ship in RN/browser bundles ---
  # socks ^10.1.1 <- RN CLI doctor (ip-address 9.0.5: 1 high, 5 moderate)
  "ip-address@<10.7.6": "10.7.6"
  # @rollup/plugin-terser ^7.0.3 <- vite 7 build (serialize-javascript 6.0.2: RCE-class + DoS)
  "serialize-javascript@<7.1.3": "7.1.4"
  # external-editor ^0.0.33 <- inquirer (tmp 0.0.33: path traversal, high)
  "tmp@0.0.33": "0.2.7"
  # patch-package ^0.2.4 -> 0.2.5 stays in-range; 0.2.6 needed for the advisory
  "tmp@0.2.5": "0.2.7"
  # @react-native-community/cli-tools ^2.9.1 (launch-editor 2.9.1: 3 high, 1 mod)
  "launch-editor@<2.14.2": "2.14.2"
  # query-string ^2.0.0 <- client API libs (decode-uri-component 0.2.2: 1 high, 1 mod)
  "decode-uri-component@<0.5.1": "0.5.1"
  # express ^2.2.1 (body-parser 2.2.2: DoS high) + RN cli-server-api
  "body-parser@<2.4.0": "2.4.0"
  # @react-native-community/cli-server-api ^1.7.1 (compression: DoS high)
  "compression@<1.8.2": "1.8.2"
  # metro ^1.2.1 (image-size 1.2.0: 3 high DoS)
  "image-size@<2.0.3": "2.0.3"
  # browserslist 4.24.4 (babel preset pins): unbounded memory / prototype write (2 high)
  "browserslist@<4.28.7": "4.28.7"
  # markdown-it@10 -> 14.3.3 (5 advisories) + its linkify-it@2.2.0 (2 high quadratic DoS)
  "linkify-it@<5.0.2": "5.0.2"
  # glob 7/8/9/10.x (CLI cmd injection high + AbortSignal bypass moderate)
  "glob@7": "7.2.3"
  "glob@8": "8.1.0"
  "glob@>=9 <10": "9.3.5"
  "glob@>=10 <10.5": "10.5.0"
  # picomatch 2.3.1 / 4.0.2 (ReDoS high + method injection moderate)
  "picomatch@>=2 <2.3.2": "2.3.2"
  "picomatch@>=4 <4.0.4": "4.0.4"
  # lodash 4.17.21/4.17.23: code injection via _.template (GHSA-r5fr-rjxr-66jc,
  # high, vulnerable <=4.17.23, patched >=4.17.24) and prototype pollution
  # (GHSA-f23m-r3pf-42rh, moderate, vulnerable =4.17.23). 4.17.24 was never
  # published; 4.18.0 is deprecated ("Bad release"); 4.18.1 (published
  # 2026-04-01, not deprecated) is the fix release and is in-range at every
  # declaring parent (^4.15.0 .. ^4.17.21), so the floor moves to 4.18.1.
  "lodash@<4.18.1": "4.18.1"
  # source-map-js 1.2.1 (event-loop DoS high)
  "source-map-js@<1.2.2": "1.2.2"
  # react-native-markdown-display pins markdown-it ^10.0.0 (5 advisories: 1 high
  # quadratic smartquotes DoS, 3 moderate, 1 low; fixed 14.3.3). PROD consumer —
  # the RN markdown stack (custom rulers/renderers on the markdown-it public API)
  # is exercised by platform/rn-components typecheck + component tests.
  "react-native-markdown-display>markdown-it": "14.3.3"
  # follow-up within same batch: flagged versions with published fixes
  # vite 7.3.5/6 (server + vitest peer): 5 advisories patched >=7.3.7
  "vite@>=7 <7.3.7": "7.3.8"
  # google-auth-library/gtoken pin jws ^4.0.0 (HMAC verify flaw, no patch in 4.0.0)
  "jws@4": "4.0.1"
  # firebase-admin>jsonwebtoken pins jws ^3.2.2 (HMAC verify flaw, patched 3.2.3;
  # jsonwebtoken 9.0.3 already moved to jws ^4.0.1 but firebase-admin 13 resolves 9.0.2)
  "jws@<3.2.3": "3.2.3"
  # firebase-admin>busboy chain (3 advisories: 2 high DoS + CRLF moderate)
  "@fastify/busboy@<3.2.2": "3.2.5"
  # firestore/grpc chain (5 high + 1 low; firebase uses ^1.13, RN firebase 0.x)
  "@grpc/grpc-js@<1.13.6": "1.14.7"
  # @babel/preset-env pins <7.29.4 (generator crash)
  "@babel/plugin-transform-modules-systemjs@<7.29.4": "7.29.4"
  # fast-xml-parser's builder (attr value injection; RN CLI chain)
  "fast-xml-builder@<1.1.7": "1.3.2"
  # @hono/node-server has two advisory legs (via @modelcontextprotocol/node,
  # which declares ^1.19.9 || ^2.1.3): GHSA-jpvv-r467-5p4w (moderate, path
  # traversal via backslash parsing, patched >=1.19.18) on the 1.x line and
  # GHSA-rmxm-3fg6-px4f (moderate, serveStatic double-decode bypass, patched
  # >=2.1.3) on the 2.x line. The 1.19.19 pin cleared the first but is itself
  # vulnerable to the second. The override is deliberately scoped to the
  # @modelcontextprotocol/node leg — @modelcontextprotocol/node is the only
  # consumer in the tree, and a parent-scoped key leaves other consumers free
  # to resolve their own declared range (as the tree-wide fast-xml-parser
  # override shows for the opposite case) — so a future package that depends
  # on @hono/node-server is not force-pinned. Force 2.1.9 — inside the
  # parent's declared range, clears both advisories.
  "@modelcontextprotocol/node>@hono/node-server": "2.1.9"
  # @tailwindcss/typography@0.5.20 (direct dep of web + docs-site) pins
  # postcss-selector-parser at exactly 6.0.10, which carries GHSA-rj75-hqrm-r3gf
  # (moderate — quadratic-complexity flat-selector parsing DoS, patched
  # >=6.1.5). The tree already resolves 6.1.5 for tailwindcss and
  # postcss-nested, so force the same patched 6.1.5 onto the typography leg;
  # scoped via @tailwindcss/typography>postcss-selector-parser so only this
  # pin is affected.
  "@tailwindcss/typography>postcss-selector-parser": "6.1.5"
  # @fedify/fedify (platform/server) pins @opentelemetry/sdk-metrics at exactly
  # 2.7.1, which resolves @opentelemetry/core@2.7.1 (GHSA-8988-4f7v-96qf
  # moderate: unbounded memory allocation in W3C Baggage propagation, patched
  # >=2.8.0). Bumping @fedify/* to 2.4.6 does not clear it — 2.4.6's published
  # manifest pins the same sdk-metrics 2.7.1, so the override is the fix and
  # the bump is only for peer alignment. sdk-metrics@2.12.0 declares
  # core@2.12.0 + resources@2.12.0 (already in the tree via fedify's
  # sdk-trace-base@2.12.0 leg) and peers @opentelemetry/api >=1.9.0 <1.10.0
  # (fedify declares ~1.9.1), so it adds one resolution and removes the
  # 2.7.1 core/resources legs entirely. Parent-scoped: fedify is the only
  # consumer of sdk-metrics in the tree (@fedify/express / @fedify/postgres
  # declare no OTel deps), and a scoped key leaves future consumers free.
  "@fedify/fedify>@opentelemetry/sdk-metrics": "2.12.0"


allowBuilds:
  "@evilmartians/lefthook": true
  "@firebase/util": true
  "@sentry/cli": true
  bcrypt: true
  canvas: true
  core-js: true
  core-js-pure: true
  esbuild: true
  hyochan-welcome: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  web-audio-api: true

# Supply-chain policy: keep newly published versions (any version whose
# publish time is newer than this window, in minutes) out of resolution.
# Fresh resolutions read this from pnpm-workspace.yaml at install time
# (pnpm 11 does not record minimumReleaseAge* in the lockfile). The excludes
# below whitelist the security overrides' target packages so a freshly
# published patched release can resolve inside the window — the alternative
# is staying on the vulnerable pin until the package is 24h old.
#
# Maintenance rule: the excludes are name-only patterns (all versions of
# @hono/node-server and @opentelemetry/sdk-metrics, not just the currently
# pinned ones), so when an override target above is re-pointed at a future
# patched release — e.g. a @hono/node-server 2.1.10 or an
# @opentelemetry/sdk-metrics 2.12.2 fixing a new advisory — no change to
# this list is needed: the name-only pattern covers the new version and, if
# it published inside the 24h window, resolves immediately instead of
# hard-failing under the strict age policy.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@hono/node-server'
  - '@opentelemetry/sdk-metrics'
