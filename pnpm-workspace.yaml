packages:
  - "libraries/*"
  - "platform/*"
  - "examples/*"
  - "plugins/*/*"
  - "docs-site"

linkWorkspacePackages: deep

overrides:
  # form-data 2.5.3 arrives only via @types/request (declared by firebase-admin
  # and via google-gax > retry-request in the firebase-admin chain). 2.5.3
  # carries GHSA-fjxv-7rqg-78g4 (critical) + GHSA-hmw2-7cc7-3qxx (high); the
  # latest 2.x, 2.5.6, clears both and is in-range for @types/request (^2.5.0).
  # Scoped because @types/request is a transitive type-only dep (no direct bump
  # handle) and jsdom's form-data 4.x instance must not be affected.
  "@types/request>form-data": "2.5.6"
  "@types/react": "19.2.14"
  "@types/react-dom": "19.2.3"
  "@tanstack/react-query": "5.90.16"
  react: "19.2.6"
  react-dom: "19.2.6"
  # icon-set-creator pins sharp@0.30.7; its prebuild often times out in CI and
  # then node-gyp fails (no make). Force the same sharp used by core/server.
  sharp: "0.33.5"
  # mermaid pulls dompurify ^3.3.3 which resolved to vulnerable 3.4.15
  # (GHSA-cg2g-xh64-v4q7 + others). Force the patched 3.4.17 tree-wide.
  dompurify: "3.4.17"
  # undici is pulled in by @sentry/cli (6.25.0), @digitalbazaar/http-client
  # (6.29.1), apns2 (7.10.0) and @fedify/vocab-runtime (7.30.1). The 6.x lines
  # are end-of-life; 7.30.1 still carries CVE-2025-7783 (HTTP/2 Rapid Reset,
  # fixed in 7.30.2). Force 7.30.2 tree-wide. This crosses the 6.x->7.x major
  # boundary for the two 6.x consumers (declared ^6.22.0 / ^6.28.0); undici's
  # public fetch API is stable across the major, so the risk is low.
  undici: "7.30.2"
  # handlebars 4.7.9 (via ts-jest 29.4.9 and
  # @release-it/conventional-changelog > conventional-changelog-writer 8.0.0,
  # both dev tooling) has 2 critical JS-injection advisories (GHSA-8r5x-fm3f-whwj,
  # GHSA-p8wg-vrv2-v86f) + 1 moderate, all fixed in 4.7.10. Both parents' caret
  # ranges (^4.7.9 / ^4.7.7) already allow 4.7.10; the lockfile is stale.
  # Patch-level, dev-only.
  handlebars: "4.7.10"

allowBuilds:
  "@evilmartians/lefthook": true
  "@firebase/util": true
  "@sentry/cli": true
  bcrypt: true
  canvas: true
  core-js: true
  core-js-pure: true
  esbuild: true
  hyochan-welcome: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  web-audio-api: true

minimumReleaseAgeExclude:
  - livekit-client@2.19.2
  - '@riddl/core'
