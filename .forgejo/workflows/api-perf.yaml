name: API performance (fixture)

# Run independently so API latency checks stay parallel with integration jobs.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

# Latency numbers are only comparable between runs that had the runner to
# themselves, so never let two perf runs for a ref overlap.
concurrency:
  group: api-perf-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_BRANCH: main

jobs:
  api-perf:
    runs-on: docker
    container:
      image: node:24-alpine
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openpeeps
          POSTGRES_PASSWORD: openpeeps
          POSTGRES_DB: openpeeps
        options: >-
          --health-cmd "pg_isready -U openpeeps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://openpeeps:openpeeps@postgres:5432/openpeeps
      REDIS_HOST: redis
      DISABLE_CONFIG_CACHE: 'true'
      JWT_SECRET: xxx
      PERF_DB_TIMING: '1'
      PERF_BASE_URL: http://127.0.0.1:5173
    steps:
      - name: Install tools
        run: apk add --no-cache git python3 make g++ unzip zip
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build
        run: |
          pnpm --filter "@openpeepshq/server..." \
            --filter "@openpeepshq/tests..." \
            build
      - name: Generate perf fixture
        run: pnpm --filter @openpeepshq/tests run fixtures:generate-perf
      - name: Restore fixture
        run: |
          node platform/tests/scripts/restore-fixture.mjs \
            platform/tests/fixtures/backups/perf-scale.zip
      - name: Start API
        working-directory: platform/server
        run: |
          # Redirect logs so the API cannot block on a closed step pipe,
          # and avoid `exit` from this script (that can take the process group).
          NODE_ENV=production nohup node dist/server.js \
            >/tmp/openpeeps-api.log 2>&1 &
          echo $! >/tmp/openpeeps-api.pid
          for i in $(seq 1 60); do
            if wget -q -T 5 -O- http://127.0.0.1:5173/health >/dev/null 2>&1; then
              echo "API ready (pid $(cat /tmp/openpeeps-api.pid))"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "API failed to become healthy" >&2
              tail -n 80 /tmp/openpeeps-api.log >&2 || true
              exit 1
            fi
            sleep 2
          done
      - name: Run API perf
        env:
          PERF_BACKUP_ZIP: platform/tests/fixtures/backups/perf-scale.zip
          PERF_EMAIL: trinay+0@allpeep.com
          PERF_ENFORCE: '1'
          PERF_ITERATIONS: '5'
          PERF_PASSWORD: perf-password-1
          PERF_REQUIRE_PROFILE_GRAPH: '1'
          PERF_WARMUP: '1'
        run: |
          set +e
          pnpm --filter @openpeepshq/tests run perf:api
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "----- API log -----" >&2
            tail -n 80 /tmp/openpeeps-api.log >&2 || true
          fi
          exit "$status"
      # Print results in the job log. GitHub upload-artifact@v4 looks for
      # hostedtoolcache Node and fails Complete job on this runner.
      - name: Upload results
        if: always()
        run: |
          results=platform/tests/.perf-results
          if [ ! -d "$results" ]; then
            echo "No perf results directory"
            exit 0
          fi
          ls -la "$results"
          for f in "$results"/*; do
            [ -f "$f" ] || continue
            echo "===== $(basename "$f") ====="
            cat "$f"
          done
