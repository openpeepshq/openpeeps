name: regenerate-changelog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

env:
  DEFAULT_BRANCH: main
  CHANGELOG_BRANCH: changelog

# Avoid overlapping scheduled runs (or reruns) racing on the same changelog branch.
concurrency:
  group: ${{ forgejo.repository }}-regenerate-changelog
  cancel-in-progress: false

jobs:
  regenerate-changelog:
    runs-on: docker
    container:
      image: node:24-alpine
    steps:
      - name: Install dependencies
        run: apk add --no-cache git curl jq
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + tags are required for the changelog to span releases.
          fetch-depth: 0
          token: ${{ forgejo.token }}
          ref: ${{ env.DEFAULT_BRANCH }}
      - name: Regenerate changelog, open PR and merge
        env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          BASE_REF: ${{ env.DEFAULT_BRANCH }}
          HEAD_REF: ${{ env.CHANGELOG_BRANCH }}
        run: |
          set -euo pipefail

          git config user.name "Nightly Builder"
          git config user.email "openpeeps@allpeep.com"

          node scripts/generate-changelog.mjs

          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog is already up to date; nothing to do."
            exit 0
          fi

          # Publish the regenerated changelog onto a dedicated branch. The branch
          # is ephemeral (deleted on merge), so a force push keeps it clean if a
          # previous run left it behind.
          git checkout -B "${HEAD_REF}"
          git add CHANGELOG.md
          git commit -m "Regenerate changelog"
          git push -f origin "HEAD:${HEAD_REF}"

          api="${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}"

          # Reuse an existing open PR for this head -> base if one is lingering,
          # otherwise create a fresh one.
          pr_number="$(curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${api}/pulls?state=open" \
            | jq -r --arg headref "${HEAD_REF}" --arg baseref "${BASE_REF}" \
                'first(.[] | select(.head.ref == $headref and .base.ref == $baseref) | .number) // empty')"

          if [ -z "${pr_number}" ]; then
            echo "Creating pull request ${HEAD_REF} -> ${BASE_REF}."
            pr_number="$(jq -n \
              --arg title "Regenerate changelog" \
              --arg head "${HEAD_REF}" \
              --arg base "${BASE_REF}" \
              --arg body "Automated: regenerated CHANGELOG.md from conventional commits." \
              '{title: $title, head: $head, base: $base, body: $body}' \
              | curl -fsS -X POST \
                -H "Authorization: token ${FORGEJO_TOKEN}" \
                -H "Content-Type: application/json" \
                -d @- \
                "${api}/pulls" \
              | jq -r '.number')"
          else
            echo "Reusing existing pull request #${pr_number}."
          fi

          if [ -z "${pr_number}" ] || [ "${pr_number}" = "null" ]; then
            echo "Failed to determine pull request number." >&2
            exit 1
          fi

          # Forgejo computes mergeability asynchronously; wait for it before merging.
          mergeable="false"
          for _ in $(seq 1 30); do
            mergeable="$(curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" \
              "${api}/pulls/${pr_number}" | jq -r '.mergeable')"
            if [ "${mergeable}" = "true" ]; then
              break
            fi
            echo "PR #${pr_number} not mergeable yet (mergeable=${mergeable}); waiting..."
            sleep 5
          done

          if [ "${mergeable}" != "true" ]; then
            echo "PR #${pr_number} did not become mergeable in time." >&2
            exit 1
          fi

          echo "Merging pull request #${pr_number} and deleting ${HEAD_REF}."
          jq -n '{Do: "merge", delete_branch_after_merge: true}' \
            | curl -fsS -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @- \
              "${api}/pulls/${pr_number}/merge"
  build:
    uses: ./.forgejo/workflows/build.yaml
    with:
      repository: ${{ forgejo.repository }}
  tag:
    runs-on: docker
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Docker login
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ vars.REGISTRY_USER }}" --password-stdin "codeberg.org"
      - name: Tag
        run: |
          short_sha=$(echo "${{ forgejo.sha }}" | cut -c1-8)
          repo="${GITHUB_REPOSITORY:-${FORGEJO_REPOSITORY:-}}"
          base="codeberg.org/${repo}"
          docker buildx imagetools create --tag "${base}:nightly" \
            "${base}:${short_sha}"
