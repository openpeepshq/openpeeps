name: regenerate-changelog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

env:
  DEFAULT_BRANCH: main

# Avoid overlapping scheduled runs (or reruns) racing on the same changelog push.
concurrency:
  group: ${{ forgejo.repository }}-regenerate-changelog
  cancel-in-progress: false

jobs:
  regenerate-changelog:
    runs-on: docker
    container:
      image: node:24-alpine
    steps:
      - name: Install dependencies
        run: apk add --no-cache git
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history + tags are required for the changelog to span releases.
          fetch-depth: 0
          token: ${{ forgejo.token }}
          ref: ${{ env.DEFAULT_BRANCH }}
          # Don't persist the Actions token as a git auth header; the push below
          # authenticates with the dedicated changelog credentials instead.
          persist-credentials: false
      - name: Regenerate changelog
        env:
          CHANGELOG_USER: ${{ vars.CHANGELOG_USER }}
          CHANGELOG_TOKEN: ${{ secrets.CHANGELOG_TOKEN }}
          REPO: ${{ forgejo.repository }}
        run: |
          set -euo pipefail

          node scripts/generate-changelog.mjs

          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog is already up to date; nothing to do."
            exit 0
          fi

          git config user.name "Nightly Builder"
          git config user.email "openpeeps@allpeep.com"
          git add CHANGELOG.md
          git commit -m "Regenerate changelog"

          # Push with the dedicated changelog credentials (a PAT with repo write).
          # CHANGELOG.md is exempt from branch protection, so the changelog-only
          # commit can go straight to the default branch. Rebase first in case
          # main advanced during the run.
          git remote set-url origin "https://${CHANGELOG_USER}:${CHANGELOG_TOKEN}@code.openpeeps.org/${REPO}.git"
          git pull --rebase origin "${{ env.DEFAULT_BRANCH }}"
          git push origin "HEAD:${{ env.DEFAULT_BRANCH }}"
