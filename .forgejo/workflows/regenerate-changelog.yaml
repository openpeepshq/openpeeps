name: regenerate-changelog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

env:
  DEFAULT_BRANCH: main

# Avoid overlapping scheduled runs (or reruns) racing on the same changelog push.
concurrency:
  group: ${{ forgejo.repository }}-regenerate-changelog
  cancel-in-progress: false

jobs:
  regenerate-changelog:
    runs-on: docker
    container:
      image: node:24-alpine
    steps:
      - name: Install dependencies
        run: apk add --no-cache git
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + tags are required for the changelog to span releases.
          fetch-depth: 0
          token: ${{ forgejo.token }}
          ref: ${{ env.DEFAULT_BRANCH }}
      - name: Regenerate changelog
        run: |
          set -euo pipefail

          node scripts/generate-changelog.mjs

          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog is already up to date; nothing to do."
            exit 0
          fi

          git config user.name "Nightly Builder"
          git config user.email "openpeeps@allpeep.com"
          git add CHANGELOG.md
          git commit -m "Regenerate changelog"

          # CHANGELOG.md is exempt from branch protection, so the Actions token
          # (persisted by checkout) can push it straight to the default branch
          # even though it is not on the push allowlist. Rebase first in case
          # main advanced during the run.
          git pull --rebase origin "${{ env.DEFAULT_BRANCH }}"
          git push origin "HEAD:${{ env.DEFAULT_BRANCH }}"
  build:
    uses: ./.forgejo/workflows/build.yaml
    with:
      repository: ${{ forgejo.repository }}
  tag:
    runs-on: docker
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Docker login
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ vars.REGISTRY_USER }}" --password-stdin "codeberg.org"
      - name: Tag
        run: |
          short_sha=$(echo "${{ forgejo.sha }}" | cut -c1-8)
          repo="${GITHUB_REPOSITORY:-${FORGEJO_REPOSITORY:-}}"
          base="codeberg.org/${repo}"
          docker buildx imagetools create --tag "${base}:nightly" \
            "${base}:${short_sha}"
