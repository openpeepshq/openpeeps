name: regenerate-changelog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

env:
  DEFAULT_BRANCH: main

# Avoid overlapping scheduled runs (or reruns) racing on the same changelog push.
concurrency:
  group: ${{ forgejo.repository }}-regenerate-changelog
  cancel-in-progress: false

jobs:
  regenerate-changelog:
    runs-on: docker
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ forgejo.token }}
      - name: Regenerate changelog
        env:
          DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/generate-changelog.mjs

          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is up to date; nothing to commit."
            exit 0
          fi

          git config user.name "Nightly Builder"
          git config user.email "openpeeps@allpeep.com"
          git add CHANGELOG.md
          git commit -m "chore: regenerate changelog"

          git remote set-url origin "https://${REGISTRY_USER}:${REGISTRY_PASSWORD}@codeberg.org/${{ forgejo.repository }}.git"
          git pull --rebase origin "${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
  build:
    uses: ./.forgejo/workflows/build.yaml
    with:
      repository: ${{ forgejo.repository }}
  tag:
    runs-on: docker
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Docker login
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ vars.REGISTRY_USER }}" --password-stdin "codeberg.org"
      - name: Tag
        run: |
          short_sha=$(echo "${{ forgejo.sha }}" | cut -c1-8)
          repo="${GITHUB_REPOSITORY:-${FORGEJO_REPOSITORY:-}}"
          base="codeberg.org/${repo}"
          docker buildx imagetools create --tag "${base}:nightly" \
            "${base}:${short_sha}"
