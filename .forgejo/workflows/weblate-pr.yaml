# On pushes to `weblate`, open a PR into the default branch if none exists yet.
name: weblate-pr

on:
  push:
    branches:
      - weblate

env:
  DEFAULT_BRANCH: main
  WEBLATE_BRANCH: weblate

concurrency:
  group: ${{ forgejo.repository }}-weblate-pr
  cancel-in-progress: false

jobs:
  open-pr-if-needed:
    runs-on: docker
    container:
      image: alpine:3.21
    steps:
      - name: Install curl and jq
        run: apk add --no-cache curl jq

      - name: Open PR weblate -> default if missing
        env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          BASE_REF: ${{ env.DEFAULT_BRANCH }}
          HEAD_REF: ${{ env.WEBLATE_BRANCH }}
        run: |
          set -euo pipefail
          api="${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}"

          open_count="$(curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${api}/pulls?state=open" \
            | jq -r --arg headref "${HEAD_REF}" --arg baseref "${BASE_REF}" \
                '[.[] | select(.head.ref == $headref and .base.ref == $baseref)] | length')"

          if [ "${open_count:-0}" != "0" ]; then
            echo "An open pull request from ${HEAD_REF} into ${BASE_REF} already exists."
            exit 0
          fi

          echo "Creating pull request ${HEAD_REF} -> ${BASE_REF}."
          body='Automated: Weblate translation updates for review.'
          jq -n \
            --arg title "Translations (Weblate)" \
            --arg head "${HEAD_REF}" \
            --arg base "${BASE_REF}" \
            --arg body "$body" \
            '{title: $title, head: $head, base: $base, body: $body}' \
            | curl -fsS -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @- \
            "${api}/pulls"
