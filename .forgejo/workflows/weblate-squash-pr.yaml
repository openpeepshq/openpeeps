# After Weblate pushes many small commits to `weblate`, squash them into one
# commit (see scripts/squash-branch.sh), force-push the branch, and ensure an
# open pull request exists into the default branch.
name: weblate-squash-pr

on:
  push:
    branches:
      - weblate

env:
  DEFAULT_BRANCH: main
  WEBLATE_BRANCH: weblate

concurrency:
  group: ${{ forgejo.repository }}-weblate-squash-pr
  cancel-in-progress: false

jobs:
  squash-and-pr:
    runs-on: docker
    container:
      # actions/checkout runs on Node; plain Alpine has no `node` (runner exec fails).
      image: node:24-alpine
    outputs:
      squash_sha: ${{ steps.squash.outputs.squash_sha }}
    steps:
      - name: Install git, curl, and jq
        run: apk add --no-cache bash git curl jq

      - name: Checkout weblate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.WEBLATE_BRANCH }}
          fetch-depth: 0
          token: ${{ forgejo.token }}

      - name: Squash, push, open PR if needed
        id: squash
        env:
          SQUASH_MESSAGE: "chore(i18n): Weblate Translations"
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
        run: |
          set -euo pipefail
          git config user.name "Weblate squash (CI)"
          git config user.email "openpeeps@allpeep.com"

          base_ref="${DEFAULT_BRANCH}"
          git fetch origin "${base_ref}"
          export DEFAULT_BRANCH="origin/${base_ref}"

          host="${FORGEJO_SERVER_URL#https://}"
          host="${host#http://}"
          git remote set-url origin "https://${FORGEJO_ACTOR}:${FORGEJO_TOKEN}@${host}/${FORGEJO_REPOSITORY}.git"

          before_sha="$(git rev-parse HEAD)"

          bash scripts/squash-branch.sh --ci

          after_sha="$(git rev-parse HEAD)"
          squash_sha="$(git rev-parse HEAD)"
          wrote=0
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "squash_sha=${squash_sha}" >> "${GITHUB_OUTPUT}"
            wrote=1
          fi
          if [ -n "${FORGEJO_OUTPUT:-}" ]; then
            echo "squash_sha=${squash_sha}" >> "${FORGEJO_OUTPUT}"
            wrote=1
          fi
          if [ "$wrote" -eq 0 ]; then
            echo "GITHUB_OUTPUT / FORGEJO_OUTPUT not set; cannot record squash_sha." >&2
            exit 1
          fi

          if [ "$before_sha" != "$after_sha" ]; then
            echo "Squash rewrote history; force-pushing ${WEBLATE_BRANCH}."
            git push --force-with-lease origin "HEAD:${WEBLATE_BRANCH}"
          else
            echo "No squash rewrite (already single commit or up to date); skipping push."
          fi

          if git diff --quiet "${DEFAULT_BRANCH}" HEAD; then
            echo "Branch matches default branch; nothing to open as a pull request."
            exit 0
          fi

          open_count="$(curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/pulls?state=open" \
            | jq -r --arg headref "${WEBLATE_BRANCH}" --arg baseref "${base_ref}" \
                '[.[] | select(.head.ref == $headref and .base.ref == $baseref)] | length')"

          if [ "${open_count:-0}" != "0" ]; then
            echo "An open pull request from ${WEBLATE_BRANCH} into ${base_ref} already exists."
            exit 0
          fi

          echo "Creating pull request ${WEBLATE_BRANCH} -> ${base_ref}."
          body='Automated: Weblate updates squashed into a single commit for review.'
          jq -n \
            --arg title "Translations (Weblate)" \
            --arg head "${WEBLATE_BRANCH}" \
            --arg base "${base_ref}" \
            --arg body "$body" \
            '{title: $title, head: $head, base: $base, body: $body}' \
            | curl -fsS -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @- \
              "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/pulls"

  build:
    needs: [squash-and-pr]
    uses: ./.forgejo/workflows/build.yaml
    secrets: inherit
    with:
      override_sha: ${{ needs.squash-and-pr.outputs.squash_sha }}
      # Caller context still has owner/repo; nested build may not.
      repository: ${{ forgejo.repository }}
