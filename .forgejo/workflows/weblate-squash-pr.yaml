# After Weblate pushes to `weblate`, squash into one commit, force-push to
# `weblate-pr` (PAT auth), and open a PR into the default branch if none exists.
name: weblate-squash-pr

on:
  push:
    branches:
      - weblate

env:
  DEFAULT_BRANCH: main
  WEBLATE_BRANCH: weblate
  WEBLATE_PR_BRANCH: weblate-pr

concurrency:
  group: ${{ forgejo.repository }}-weblate-squash-pr
  cancel-in-progress: false

jobs:
  squash-and-pr:
    runs-on: docker
    container:
      image: node:24-alpine
    steps:
      - name: Install git, curl, and jq
        run: apk add --no-cache bash git curl jq

      - name: Checkout weblate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.WEBLATE_BRANCH }}
          fetch-depth: 0
          token: ${{ forgejo.token }}

      - name: Squash, push weblate-pr, open PR if needed
        env:
          SQUASH_MESSAGE: "chore(i18n): Weblate Translations"
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          GIT_PAT: ${{ secrets.REGISTRY_PASSWORD }}
          GIT_USER: ${{ vars.REGISTRY_USER }}
        run: |
          set -euo pipefail
          git config user.name "Weblate squash (CI)"
          git config user.email "openpeeps@allpeep.com"

          base_ref="${DEFAULT_BRANCH}"
          git fetch origin "${base_ref}"
          export DEFAULT_BRANCH="origin/${base_ref}"

          host="${FORGEJO_SERVER_URL#https://}"
          host="${host#http://}"
          git remote set-url origin "https://${GIT_USER}:${GIT_PAT}@${host}/${FORGEJO_REPOSITORY}.git"

          bash scripts/squash-branch.sh --ci

          if git diff --quiet "${DEFAULT_BRANCH}" HEAD; then
            echo "Branch matches default branch; nothing to push or open as a pull request."
            exit 0
          fi

          echo "Force-pushing squashed HEAD to ${WEBLATE_PR_BRANCH}."
          git push --force-with-lease origin "HEAD:${WEBLATE_PR_BRANCH}"

          open_count="$(curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/pulls?state=open" \
            | jq -r --arg headref "${WEBLATE_PR_BRANCH}" --arg baseref "${base_ref}" \
                '[.[] | select(.head.ref == $headref and .base.ref == $baseref)] | length')"

          if [ "${open_count:-0}" != "0" ]; then
            echo "An open pull request from ${WEBLATE_PR_BRANCH} into ${base_ref} already exists."
            exit 0
          fi

          echo "Creating pull request ${WEBLATE_PR_BRANCH} -> ${base_ref}."
          body='Automated: Weblate updates squashed into a single commit for review.'
          jq -n \
            --arg title "Translations (Weblate)" \
            --arg head "${WEBLATE_PR_BRANCH}" \
            --arg base "${base_ref}" \
            --arg body "$body" \
            '{title: $title, head: $head, base: $base, body: $body}' \
            | curl -fsS -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @- \
              "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/pulls"
