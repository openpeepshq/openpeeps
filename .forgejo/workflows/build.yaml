on:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      override_sha:
        description: Full commit SHA to build (e.g. after a caller rewrote history); when empty, use the triggering SHA.
        type: string
        required: false
        default: ""
      repository:
        description: "owner/repo for registry paths (pass from caller when nested workflow_call loses github.repository)."
        type: string
        required: false
        default: ""

env:
  DEFAULT_BRANCH: "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  set-variables:
    runs-on: docker
    container:
      image: node:24-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout (resolve SHA for workflow_call when forgejo.sha is empty)
        uses: actions/checkout@releases/v6
        with:
          fetch-depth: 1
          token: ${{ forgejo.token }}
          ref: ${{ inputs.override_sha != '' && inputs.override_sha || forgejo.sha || forgejo.ref }}
      - name: Set variables
        id: vars
        env:
          JAMS_LIVEKIT_URL: ${{ secrets.JAMS_LIVEKIT_URL }}
          JAMS_LIVEKIT_API_KEY: ${{ secrets.JAMS_LIVEKIT_API_KEY }}
          JAMS_LIVEKIT_API_SECRET: ${{ secrets.JAMS_LIVEKIT_API_SECRET }}
        run: |
          ref_name="${{ forgejo.ref_name }}"
          jams_enabled=$(if [ -n "$JAMS_LIVEKIT_URL" ] && [ -n "$JAMS_LIVEKIT_API_KEY" ] && [ -n "$JAMS_LIVEKIT_API_SECRET" ]; then echo "true"; else echo "false"; fi)
          sha="$(git rev-parse HEAD)"
          if [ -z "$sha" ]; then
            echo "Could not resolve commit SHA after checkout." >&2
            exit 1
          fi
          short_sha=$(echo "$sha" | cut -c1-8)
          # ref_slug: lowercase, non-alphanumeric -> single dash, max 63 chars
          ref_slug=$(echo "$ref_name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | cut -c1-63)
          if [ "$ref_name" = "${{ env.DEFAULT_BRANCH }}" ]; then
            tag="latest"
            echo "Running on default branch '${{ env.DEFAULT_BRANCH }}': tag = 'latest'"
          else
            tag="$ref_slug"
            echo "Running on branch '$ref_name': tag = $tag"
          fi
          version="$(date +%Y-%m-%d)-${short_sha}"
          # Sentry / runtime ENVIRONMENT: production for main and prod/*, else development.
          case "$ref_name" in
            "${{ env.DEFAULT_BRANCH }}"|prod/*) environment="production" ;;
            *) environment="development" ;;
          esac
          is_release_branch=$(if [ "$ref_name" = "${{ env.DEFAULT_BRANCH }}" ] || [ "$ref_name" = "staging" ] || [ "$ref_name" = "stable" ]; then echo "true"; else echo "false"; fi)

          caller_repo="${{ inputs.repository }}"
          if [ -n "$caller_repo" ] && [ "$caller_repo" != "null" ]; then
            image_repo="$caller_repo"
          elif [ -n "${GITHUB_REPOSITORY:-}" ]; then
            image_repo="$GITHUB_REPOSITORY"
          elif [ -n "${FORGEJO_REPOSITORY:-}" ]; then
            image_repo="$FORGEJO_REPOSITORY"
          else
            uri=$(git remote get-url origin 2>/dev/null || true)
            case "$uri" in
              git@*)
                image_repo="${uri#*:}"
                image_repo="${image_repo%.git}"
                ;;
              http*)
                image_repo=$(printf '%s\n' "$uri" | sed -E 's#^https?://[^/]+/##; s#\.git$##')
                ;;
              *)
                image_repo=""
                ;;
            esac
          fi
          if [ -z "$image_repo" ] || [ "$image_repo" = "/" ]; then
            echo "Could not derive owner/repo for registry (caller repository input, GITHUB_REPOSITORY, FORGEJO_REPOSITORY, or git remote)." >&2
            exit 1
          fi
          registry_image_base="code.openpeeps.org/${image_repo}"
          echo "tag=$tag" >> $FORGEJO_OUTPUT
          echo "version=$version" >> $FORGEJO_OUTPUT
          echo "short_sha=$short_sha" >> $FORGEJO_OUTPUT
          echo "full_sha=$sha" >> $FORGEJO_OUTPUT
          echo "ref_slug=$ref_slug" >> $FORGEJO_OUTPUT
          echo "environment=$environment" >> $FORGEJO_OUTPUT
          echo "is_release_branch=$is_release_branch" >> $FORGEJO_OUTPUT
          echo "registry_image_base=$registry_image_base" >> $FORGEJO_OUTPUT
          echo "image_repo=$image_repo" >> $FORGEJO_OUTPUT
          echo "jams_enabled=$jams_enabled" >> $FORGEJO_OUTPUT
          echo "Sentry/runtime ENVIRONMENT=$environment (branch=$ref_name)"
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      full_sha: ${{ steps.vars.outputs.full_sha }}
      ref_slug: ${{ steps.vars.outputs.ref_slug }}
      environment: ${{ steps.vars.outputs.environment }}
      is_release_branch: ${{ steps.vars.outputs.is_release_branch }}
      registry_image_base: ${{ steps.vars.outputs.registry_image_base }}
      image_repo: ${{ steps.vars.outputs.image_repo }}
      jams_enabled: ${{ steps.vars.outputs.jams_enabled }}

  # Not gated on i18n-check anymore: merge-gate reports i18n failures, so the
  # image build starts immediately in parallel with the checks.
  #
  # Builds both images in one job: one checkout, one login, one persistent
  # builder, one docker buildx bake. The buildkitd container lives on the
  # runner host with a named volume, so its layer cache and the pnpm-store
  # cache mount survive across jobs. main maintains the buildcache-main
  # registry tag (mode=max); PR/branch builds only read it and export no
  # cache. Images are pushed (--push dedupes against the cache-export
  # blobs, ~15s measured) and pulled into the host dockerd (~45s) for the
  # integration shards; --load would instead re-assemble and recompress
  # ~2GB into dockerd on every run (114-131s measured).
  build-images:
    runs-on: docker
    needs: [set-variables]
    container:
      image: node:24-alpine
    steps:
      - name: Install Docker CLI and git
        run: apk add --no-cache docker-cli docker-cli-buildx git
      - uses: actions/checkout@releases/v6
        with:
          ref: ${{ needs.set-variables.outputs.full_sha }}
          fetch-depth: 0
      - name: Generate changelog (baked into image via COPY . .)
        run: |
          git fetch --tags --force
          node scripts/generate-changelog.mjs
      - name: Set image and version
        run: |
          echo "REGISTRY_IMAGE_BASE=${{ needs.set-variables.outputs.registry_image_base }}" >> $GITHUB_ENV
          echo "REGISTRY_IMAGE=${{ secrets.REGISTRY }}/${{ needs.set-variables.outputs.image_repo }}" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.set-variables.outputs.short_sha }}" >> $GITHUB_ENV
          echo "VERSION=${{ needs.set-variables.outputs.version }}" >> $GITHUB_ENV
          echo "TAG=${{ needs.set-variables.outputs.tag }}" >> $GITHUB_ENV
      - name: Docker login
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ vars.REGISTRY_USER }}" --password-stdin "code.openpeeps.org"
      - name: Create release tag on stable
        if: forgejo.ref_name == 'stable'
        run: |
          git remote set-url origin "https://${{ forgejo.actor }}:${{ forgejo.token }}@code.openpeeps.org/${{ needs.set-variables.outputs.image_repo }}.git"
          release_tag="${VERSION}-RELEASE"
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Git tag ${release_tag} already exists. Skipping tag creation."
          else
            git tag "${release_tag}" "${{ needs.set-variables.outputs.full_sha }}"
            git push origin "refs/tags/${release_tag}"
          fi
      - name: Build and push images
        env:
          # Consumed by the variables in docker-bake.hcl (tags + app args).
          IMAGE: ${{ needs.set-variables.outputs.registry_image_base }}
          SHA: ${{ needs.set-variables.outputs.short_sha }}
          VERSION: ${{ needs.set-variables.outputs.version }}
          ENVIRONMENT: ${{ needs.set-variables.outputs.environment }}
        run: |
          app_tag="${IMAGE}:${SHA}"
          test_tag="${IMAGE}:test-${SHA}"

          # Single image-exists guard: skip the whole bake when both images
          # are already in the registry (re-runs of the same commit).
          if docker manifest inspect "${app_tag}" >/dev/null 2>&1 && docker manifest inspect "${test_tag}" >/dev/null 2>&1; then
            echo "Both images already exist; skipping build."
          else
            # Persistent builder (create-if-missing, never removed): buildkitd
            # runs on the runner host with a named volume, so its layer cache
            # and the pnpm-store cache mount survive across jobs AND across
            # container recreation (docker rm keeps named volumes). Recreate
            # it only when missing or stopped.
            if ! docker inspect buildkitd >/dev/null 2>&1; then
              docker run -d --name buildkitd --privileged --network host \
                -v buildkit-cache:/var/lib/buildkit \
                moby/buildkit:buildx-stable-1
            elif [ "$(docker inspect -f '{{.State.Running}}' buildkitd)" != "true" ]; then
              docker rm -f buildkitd >/dev/null 2>&1 || true
              docker run -d --name buildkitd --privileged --network host \
                -v buildkit-cache:/var/lib/buildkit \
                moby/buildkit:buildx-stable-1
            fi
            # The buildx CLI record is ephemeral (fresh job container each
            # run); recreate it each time — this never touches the buildkitd
            # container or its cache. create pings the daemon, so retry until
            # buildkitd accepts connections (cold starts take a moment).
            create_ok=""
            for i in $(seq 1 30); do
              if docker buildx create --name ci --driver remote docker-container://buildkitd >/dev/null 2>&1; then
                create_ok="1"
                break
              fi
              docker buildx rm -f ci >/dev/null 2>&1 || true
              sleep 1
            done
            if [ -z "$create_ok" ]; then
              echo "Could not connect to buildkitd after 30s" >&2
              exit 1
            fi

            # Static cache refs, derived once: main maintains the
            # buildcache-main registry tag (mode=max); PR/branch builds only
            # read it and export no cache. bake has no --cache-from/--cache-to
            # flags; the policy goes through per-target --set overrides.
            cache_args="--set app.cache-from=type=registry,ref=${IMAGE}:buildcache-main"
            cache_args="$cache_args --set test.cache-from=type=registry,ref=${IMAGE}:buildcache-main"
            if [ "${{ forgejo.ref_name }}" = "${{ env.DEFAULT_BRANCH }}" ]; then
              cache_args="$cache_args --set app.cache-to=type=registry,ref=${IMAGE}:buildcache-main,mode=max"
              cache_args="$cache_args --set test.cache-to=type=registry,ref=${IMAGE}:buildcache-main,mode=max"
            fi

            # Transient Docker errors (layer blob, network) cause build
            # failures; retry up to 3 times. With the persistent builder a
            # retry reuses the layer cache for fast recovery.
            for attempt in 1 2 3; do
              if docker buildx bake -f docker-bake.hcl --builder ci --push \
                  ${cache_args} \
                && docker pull "${app_tag}" \
                && docker pull "${test_tag}"; then
                break
              elif [ "$attempt" -eq 3 ]; then
                echo "Image build/push failed after 3 attempts"
                exit 1
              else
                echo "Build attempt $attempt failed, retrying in 10s..."
                sleep 10
              fi
            done

            # Prune on main so the persistent builder's cache stays bounded.
            if [ "${{ forgejo.ref_name }}" = "${{ env.DEFAULT_BRANCH }}" ]; then
              docker buildx prune --builder ci --max-used-space 20GB --force
            fi
          fi

          # On the build path the pulls above put both images in the host
          # dockerd for the integration jobs; on skipped re-runs the
          # inspect-or-pull covers runners that do not have them yet.
          docker image inspect "${app_tag}" >/dev/null 2>&1 || docker pull "${app_tag}"
          docker image inspect "${test_tag}" >/dev/null 2>&1 || docker pull "${test_tag}"

  test-unit:
    if: needs.set-variables.outputs.is_release_branch == 'false'
    runs-on: docker
    needs: [set-variables]
    container:
      image: node:24-alpine
    steps:
      - uses: actions/checkout@releases/v6
        with:
          ref: ${{ needs.set-variables.outputs.full_sha }}
      - name: Install dependencies
        run: |
          # bcrypt prebuilds live on GitHub; a 500 falls back to node-gyp.
          # imagemagick + libheif: HEIC decode for media preview tests.
          # poppler-utils: PDF rasterization for media preview tests.
          apk add --no-cache python3 make g++ imagemagick libheif poppler-utils
          corepack enable
          pnpm install
      - name: Build packages needed by unit tests
        run: >
          pnpm --filter @openpeepshq/common...
          --filter @openpeepshq/core...
          --filter @openpeepshq/react...
          build
      - name: Run unit tests
        run: >
          pnpm --filter @openpeepshq/common
          --filter @openpeepshq/core
          --filter @openpeepshq/react
          exec vitest run

  test-integration:
    if: needs.set-variables.outputs.is_release_branch == 'false'
    runs-on: docker
    needs: [build-images, set-variables]
    strategy:
      fail-fast: false
      matrix:
        # Five communities. Wall-clock time is the slowest shard. Each
        # stack stays on one Playwright worker. File split:
        # platform/tests/scripts/run-empty-shard.mjs.
        # SSO lives on test-integration-small so empty shards do not
        # start mock-oauth2-server.
        shard: ["1/5", "2/5", "3/5", "4/5", "5/5"]
    defaults:
      run:
        # Runner workspace is a mount that hides the image WORKDIR. The
        # checkout for this SHA is already baked into the test image.
        working-directory: /apat
    container:
      image:
        ${{ needs.set-variables.outputs.registry_image_base }}:test-${{ needs.set-variables.outputs.short_sha
        }}
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openpeeps
          POSTGRES_PASSWORD: openpeeps
          POSTGRES_DB: openpeeps
      redis:
        image: redis:alpine
        # Ephemeral CI cache/queue: skip RDB so a full runner disk cannot
        # trip stop-writes-on-bgsave-error and break session/SSO writes.
        cmd: ["redis-server", "--save", "", "--appendonly", "no"]
      mailpit:
        image: axllent/mailpit:v1.21
        # Image HEALTHCHECK stays "starting" for 15s; act waits that out
        # before any step. Mailpit is up in about a second.
        options: --no-healthcheck
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      pushcatcher:
        # Accepts arbitrary POSTs with HTTP 200 so webhook delivery succeeds.
        # Full payload capture is covered in Compose via scripts/push-catcher-server.mjs.
        image: mendhak/http-https-echo:31
      web:
        image:
          ${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.short_sha
          }}
        credentials:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          DISABLE_CONFIG_CACHE: "true"
          REDIS_HOST: "redis"
          JWT_SECRET: xxx
          EMAIL_CONFIG_HOST: mailpit
          EMAIL_CONFIG_PORT: "1025"
          EMAIL_CONFIG_SECURE: "false"
          EMAIL_DEFAULT_FROM: test@openpeeps.test
          SERVER_HOST: web:8080
          SERVER_PROTOCOL: http
          JAMS_LIVEKIT_API_KEY: APIxxxxxxxxxxxx
          JAMS_LIVEKIT_API_SECRET: xxxxxxxxxxxxx
      worker:
        image:
          ${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.short_sha
          }}
        credentials:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          OPENPEEPS_COMMAND: worker
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          DISABLE_CONFIG_CACHE: "true"
          REDIS_HOST: "redis"
          JWT_SECRET: xxx
          EMAIL_CONFIG_HOST: mailpit
          EMAIL_CONFIG_PORT: "1025"
          EMAIL_CONFIG_SECURE: "false"
          EMAIL_DEFAULT_FROM: test@openpeeps.test
          SERVER_HOST: web:8080
          SERVER_PROTOCOL: http
    steps:
      - name: Wait for web service
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://web:8080/health >/dev/null 2>&1; then
              echo "Web service is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for web service... ($i/60)"
            sleep 2
          done
          echo "Web service did not become ready in time" >&2
          exit 1
      - name: Run empty suite
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://web:8080
          MAILPIT_URL: http://mailpit:8025
          PUSH_CATCHER_URL: http://pushcatcher:8080
          PUSH_CATCHER_ASSERT: delivery-only
          INTEGRATION_SUITE: empty
          INTEGRATION_SKIP_RESTORE: "true"
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          # Playwright imports @openpeepshq/core, which opens Redis and
          # resolves JWT_SECRET at load. Match the web service or every
          # reconnect to localhost:6379 is printed for the whole run.
          REDIS_HOST: redis
          JWT_SECRET: xxx
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        run: node platform/tests/scripts/run-empty-shard.mjs

  test-integration-small:
    if: needs.set-variables.outputs.is_release_branch == 'false'
    runs-on: docker
    needs: [build-images, set-variables]
    defaults:
      run:
        working-directory: /apat
    container:
      image:
        ${{ needs.set-variables.outputs.registry_image_base }}:test-${{ needs.set-variables.outputs.short_sha
        }}
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openpeeps
          POSTGRES_PASSWORD: openpeeps
          POSTGRES_DB: openpeeps
      redis:
        image: redis:alpine
        cmd: ["redis-server", "--save", "", "--appendonly", "no"]
      mailpit:
        image: axllent/mailpit:v1.21
        options: --no-healthcheck
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      pushcatcher:
        image: mendhak/http-https-echo:31
      oauth:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        env:
          LOG_LEVEL: info
          SERVER_PORT: "8080"
          JSON_CONFIG: '{"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"default","tokenExpiry":3600,"requestMappings":[{"requestParam":"client_id","match":"*","claims":{"sub":"sso-test-user","email":"sso-oidc@openpeeps.test","preferred_username":"ssooidc","name":"SSO OIDC User"}}]}]}'
      web:
        image:
          ${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.short_sha
          }}
        credentials:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          DISABLE_CONFIG_CACHE: "true"
          REDIS_HOST: "redis"
          JWT_SECRET: xxx
          EMAIL_CONFIG_HOST: mailpit
          EMAIL_CONFIG_PORT: "1025"
          EMAIL_CONFIG_SECURE: "false"
          EMAIL_DEFAULT_FROM: test@openpeeps.test
          SERVER_HOST: web:8080
          SERVER_PROTOCOL: http
          JAMS_LIVEKIT_API_KEY: APIxxxxxxxxxxxx
          JAMS_LIVEKIT_API_SECRET: xxxxxxxxxxxxx
      worker:
        image:
          ${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.short_sha
          }}
        credentials:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          OPENPEEPS_COMMAND: worker
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          DISABLE_CONFIG_CACHE: "true"
          REDIS_HOST: "redis"
          JWT_SECRET: xxx
          EMAIL_CONFIG_HOST: mailpit
          EMAIL_CONFIG_PORT: "1025"
          EMAIL_CONFIG_SECURE: "false"
          EMAIL_DEFAULT_FROM: test@openpeeps.test
          SERVER_HOST: web:8080
          SERVER_PROTOCOL: http
    steps:
      - name: Wait for web service
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://web:8080/health >/dev/null 2>&1; then
              echo "Web service is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for web service... ($i/60)"
            sleep 2
          done
          echo "Web service did not become ready in time" >&2
          exit 1
      - name: Run sso and default suites
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://web:8080
          MAILPIT_URL: http://mailpit:8025
          PUSH_CATCHER_URL: http://pushcatcher:8080
          PUSH_CATCHER_ASSERT: delivery-only
          OAUTH_ISSUER_URL: http://oauth:8080/default
          INTEGRATION_SKIP_RESTORE: "true"
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          REDIS_HOST: redis
          JWT_SECRET: xxx
          MEDIA_STORAGE_PARAMS_PATH: /tmp/openpeeps-media
          LOGS_LOCAL_PATH: /tmp/openpeeps-logs
        run: |
          set -e
          # sso seeds the migrated empty database, so it runs before any
          # fixture is restored. Each restore truncates and replaces the data.
          pnpm --filter @openpeepshq/tests run test:integration:sso
          node platform/tests/scripts/restore-fixture.mjs "fixtures/backups/default-install.zip"
          pnpm --filter @openpeepshq/tests run test:integration:default

  # public + perf, split from test-integration-small so the two fixture
  # halves run in parallel: five empty shards + both halves + jams fill the
  # runner's 8 slots exactly. No oauth service — only the sso suite talks
  # to the mock IdP.
  test-integration-public-perf:
    if: needs.set-variables.outputs.is_release_branch == 'false'
    runs-on: docker
    needs: [build-images, set-variables]
    defaults:
      run:
        working-directory: /apat
    container:
      image:
        ${{ needs.set-variables.outputs.registry_image_base }}:test-${{ needs.set-variables.outputs.short_sha
        }}
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openpeeps
          POSTGRES_PASSWORD: openpeeps
          POSTGRES_DB: openpeeps
      redis:
        image: redis:alpine
        cmd: ["redis-server", "--save", "", "--appendonly", "no"]
      mailpit:
        image: axllent/mailpit:v1.21
        options: --no-healthcheck
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      pushcatcher:
        image: mendhak/http-https-echo:31
      web:
        image:
          ${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.short_sha
          }}
        credentials:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          DISABLE_CONFIG_CACHE: "true"
          REDIS_HOST: "redis"
          JWT_SECRET: xxx
          EMAIL_CONFIG_HOST: mailpit
          EMAIL_CONFIG_PORT: "1025"
          EMAIL_CONFIG_SECURE: "false"
          EMAIL_DEFAULT_FROM: test@openpeeps.test
          SERVER_HOST: web:8080
          SERVER_PROTOCOL: http
          JAMS_LIVEKIT_API_KEY: APIxxxxxxxxxxxx
          JAMS_LIVEKIT_API_SECRET: xxxxxxxxxxxxx
      worker:
        image:
          ${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.short_sha
          }}
        credentials:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          OPENPEEPS_COMMAND: worker
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          DISABLE_CONFIG_CACHE: "true"
          REDIS_HOST: "redis"
          JWT_SECRET: xxx
          EMAIL_CONFIG_HOST: mailpit
          EMAIL_CONFIG_PORT: "1025"
          EMAIL_CONFIG_SECURE: "false"
          EMAIL_DEFAULT_FROM: test@openpeeps.test
          SERVER_HOST: web:8080
          SERVER_PROTOCOL: http
    steps:
      - name: Wait for web service
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://web:8080/health >/dev/null 2>&1; then
              echo "Web service is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for web service... ($i/60)"
            sleep 2
          done
          echo "Web service did not become ready in time" >&2
          exit 1
      - name: Run public and perf suites
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://web:8080
          MAILPIT_URL: http://mailpit:8025
          PUSH_CATCHER_URL: http://pushcatcher:8080
          PUSH_CATCHER_ASSERT: delivery-only
          INTEGRATION_SKIP_RESTORE: "true"
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          REDIS_HOST: redis
          JWT_SECRET: xxx
          MEDIA_STORAGE_PARAMS_PATH: /tmp/openpeeps-media
          LOGS_LOCAL_PATH: /tmp/openpeeps-logs
          PERF_BASE_URL: http://web:8080
          PERF_EMAIL: trinay+0@allpeep.com
          PERF_PASSWORD: perf-password-1
          PERF_ENFORCE: "1"
          PERF_ITERATIONS: "5"
          PERF_WARMUP: "1"
          PERF_REQUIRE_PROFILE_GRAPH: "1"
        run: |
          set -e
          # Each restore truncates and replaces the data.
          node platform/tests/scripts/restore-fixture.mjs "fixtures/backups/public-community.zip"
          pnpm --filter @openpeepshq/tests run test:integration:public
          node platform/tests/scripts/restore-fixture.mjs "fixtures/backups/perf-scale.zip"
          pnpm --filter @openpeepshq/tests run test:integration:perf

  test-integration-jams:
    if: needs.set-variables.outputs.jams_enabled == 'true' && needs.set-variables.outputs.is_release_branch == 'false'
    runs-on: docker
    needs: [build-images, set-variables]
    # Without LiveKit credentials the suite would only self-skip, so do not
    # spend a VM and a service stack on it.
    defaults:
      run:
        working-directory: /apat
    container:
      image:
        ${{ needs.set-variables.outputs.registry_image_base }}:test-${{ needs.set-variables.outputs.short_sha
        }}
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openpeeps
          POSTGRES_PASSWORD: openpeeps
          POSTGRES_DB: openpeeps
      redis:
        image: redis:alpine
        # Ephemeral CI cache/queue: skip RDB so a full runner disk cannot
        # trip stop-writes-on-bgsave-error and break session/SSO writes.
        cmd: ["redis-server", "--save", "", "--appendonly", "no"]
      mailpit:
        image: axllent/mailpit:v1.21
        options: --no-healthcheck
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      web:
        image:
          ${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.short_sha
          }}
        credentials:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          DISABLE_CONFIG_CACHE: "true"
          REDIS_HOST: "redis"
          JWT_SECRET: xxx
          EMAIL_CONFIG_HOST: mailpit
          EMAIL_CONFIG_PORT: "1025"
          EMAIL_CONFIG_SECURE: "false"
          EMAIL_DEFAULT_FROM: test@openpeeps.test
          SERVER_HOST: web:8080
          SERVER_PROTOCOL: http
          JAMS_LIVEKIT_URL: ${{ secrets.JAMS_LIVEKIT_URL }}
          JAMS_LIVEKIT_API_KEY: ${{ secrets.JAMS_LIVEKIT_API_KEY }}
          JAMS_LIVEKIT_API_SECRET: ${{ secrets.JAMS_LIVEKIT_API_SECRET }}
      worker:
        image:
          ${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.short_sha
          }}
        credentials:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          OPENPEEPS_COMMAND: worker
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          DISABLE_CONFIG_CACHE: "true"
          REDIS_HOST: "redis"
          JWT_SECRET: xxx
          EMAIL_CONFIG_HOST: mailpit
          EMAIL_CONFIG_PORT: "1025"
          EMAIL_CONFIG_SECURE: "false"
          EMAIL_DEFAULT_FROM: test@openpeeps.test
          SERVER_HOST: web:8080
          SERVER_PROTOCOL: http
          JAMS_LIVEKIT_URL: ${{ secrets.JAMS_LIVEKIT_URL }}
          JAMS_LIVEKIT_API_KEY: ${{ secrets.JAMS_LIVEKIT_API_KEY }}
          JAMS_LIVEKIT_API_SECRET: ${{ secrets.JAMS_LIVEKIT_API_SECRET }}
    steps:
      - name: Wait for web service
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://web:8080/health >/dev/null 2>&1; then
              echo "Web service is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for web service... ($i/60)"
            sleep 2
          done
          echo "Web service did not become ready in time" >&2
          exit 1
      - name: Run jams integration suite
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://web:8080
          MAILPIT_URL: http://mailpit:8025
          INTEGRATION_SUITE: jams
          DATABASE_URL: "postgresql://openpeeps:openpeeps@postgres:5432/openpeeps"
          REDIS_HOST: redis
          JWT_SECRET: xxx
          JAMS_LIVEKIT_URL: ${{ secrets.JAMS_LIVEKIT_URL }}
          JAMS_LIVEKIT_API_KEY: ${{ secrets.JAMS_LIVEKIT_API_KEY }}
          JAMS_LIVEKIT_API_SECRET: ${{ secrets.JAMS_LIVEKIT_API_SECRET }}
        run: pnpm --filter @openpeepshq/tests run test:integration:jams

  publish-gate:
    if: needs.set-variables.outputs.is_release_branch == 'false'
    runs-on: docker
    needs: [set-variables]
    container:
      image: node:24-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git
      - uses: actions/checkout@releases/v6
        with:
          ref: ${{ needs.set-variables.outputs.full_sha }}
          fetch-depth: 0
      - name: Install dependencies
        run: |
          apk add --no-cache python3 make g++
          corepack enable
          pnpm install
      - name: Detect bumped packages
        id: bumped
        run: |
          git fetch origin refs/heads/${{ env.DEFAULT_BRANCH }}:refs/remotes/origin/${{ env.DEFAULT_BRANCH }}
          bumped=$(git diff --name-only origin/${{ env.DEFAULT_BRANCH }} HEAD \
            | grep -E '^([a-z]+|libraries/[a-z-]+|platform/[a-z-]+)/package\.json$' \
            | while read -r f; do
                case "$(dirname "$f")" in
                  platform/common) echo common ;;
                  platform/client) echo client ;;
                  platform/react) echo react ;;
                  platform/rn-components) echo rn-components ;;
                  libraries/fetch-client) echo fetch-client ;;
                  libraries/greenscreen) echo greenscreen ;;
                  libraries/react-ui) echo react-ui ;;
                esac
              done | sort -u | paste -sd ' ')
          echo "bumped=$bumped" >> $FORGEJO_OUTPUT
          echo "Bumped packages: ${bumped:-none}"
      - name: Library publish gate
        if: steps.bumped.outputs.bumped != ''
        run: |
          for pkg in ${{ steps.bumped.outputs.bumped }}; do
            echo "Checking $pkg..."
            node scripts/check-publish-gate.mjs --package "$pkg"
          done
      - name: Skip publish gate (no bumps)
        if: steps.bumped.outputs.bumped == ''
        run: echo "No packages with version bumps; skipping publish gate."

  i18n-check:
    runs-on: docker
    needs: [set-variables]
    container:
      image: node:24-alpine
    steps:
      - uses: actions/checkout@releases/v6
        with:
          ref: ${{ needs.set-variables.outputs.full_sha }}
      - name: Locale parity (required on all branches)
        run: node scripts/check-i18n-parity.mjs --strict

  lint:
    if: needs.set-variables.outputs.is_release_branch == 'false'
    runs-on: docker
    needs: [set-variables]
    container:
      image: node:24-alpine
    steps:
      - uses: actions/checkout@releases/v6
        with:
          ref: ${{ needs.set-variables.outputs.full_sha }}
      - name: Install git
        run: apk add --no-cache git
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm exec prettier --check .
      - name: ESLint
        run: pnpm run -r lint

  # The single required job for branch protection: everything that must pass
  # before merge fans in here. i18n-check, lint, publish-gate and commit-check
  # only wait for set-variables, so they run immediately in parallel with the
  # image builds and tests. Uses always() so legitimately skipped jobs (jams
  # disabled, release-branch skips) do not skip the gate, and so a failed
  # set-variables / build-images — which merely *skips* the downstream jobs
  # without failing them — is still reported as a gate failure instead of a
  # green gate.
  merge-gate:
    if: ${{ always() && !cancelled() }}
    runs-on: docker
    needs: [set-variables, i18n-check, lint, publish-gate, commit-check, build-images, test-unit, test-integration, test-integration-small, test-integration-public-perf, test-integration-jams]
    container:
      image: node:24-alpine
    steps:
      - name: All checks passed
        if: ${{ success() }}
        run: echo "All merge-gate checks succeeded."
      - name: Detect failures
        if: ${{ always() && (needs.set-variables.result == 'failure' || needs.i18n-check.result == 'failure' || needs.lint.result == 'failure' || needs.publish-gate.result == 'failure' || needs.commit-check.result == 'failure' || needs.build-images.result == 'failure' || needs.test-unit.result == 'failure' || needs.test-integration.result == 'failure' || needs.test-integration-small.result == 'failure' || needs.test-integration-public-perf.result == 'failure' || needs.test-integration-jams.result == 'failure') }}
        run: |
          echo "One or more merge-gate checks failed:"
          echo "  set-variables: ${{ needs.set-variables.result }}"
          echo "  i18n-check: ${{ needs.i18n-check.result }}"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  publish-gate: ${{ needs.publish-gate.result }}"
          echo "  commit-check: ${{ needs.commit-check.result }}"
          echo "  build-images: ${{ needs.build-images.result }}"
          echo "  test-unit: ${{ needs.test-unit.result }}"
          echo "  test-integration: ${{ needs.test-integration.result }}"
          echo "  test-integration-small: ${{ needs.test-integration-small.result }}"
          echo "  test-integration-public-perf: ${{ needs.test-integration-public-perf.result }}"
          echo "  test-integration-jams: ${{ needs.test-integration-jams.result }}"
          exit 1
      - name: Checks passed (optional jobs skipped)
        if: ${{ !success() && !failure() }}
        run: echo "Core checks passed; skipped jobs were optional (jams disabled / release branch)."

  # Runs immediately: it no longer waits for the test jobs. merge-gate
  # collects its result together with everything else.
  commit-check:
    runs-on: docker
    needs: [set-variables]
    container:
      image: node:24-alpine
    steps:
      - name: Skip commit check (release branch)
        if: needs.set-variables.outputs.is_release_branch == 'true'
        run: echo "Skipping commit check on release branch."
      - name: Skip commit check (weblate)
        if: needs.set-variables.outputs.is_release_branch == 'false' && forgejo.ref_name == 'weblate'
        run: echo "Skipping commit check on weblate branch."
      - name: Install git
        if: needs.set-variables.outputs.is_release_branch == 'false' && forgejo.ref_name != 'weblate'
        run: apk add --no-cache git
      - uses: actions/checkout@releases/v6
        if: needs.set-variables.outputs.is_release_branch == 'false' && forgejo.ref_name != 'weblate'
        with:
          ref: ${{ needs.set-variables.outputs.full_sha }}
          fetch-depth: 0
      - name: Check commit
        if: needs.set-variables.outputs.is_release_branch == 'false' && forgejo.ref_name != 'weblate'
        run: |
          git branch main origin/main
          node scripts/check-branch.mjs

  publish-packages:
    runs-on: docker
    if: forgejo.ref_name == env.DEFAULT_BRANCH
    needs: [merge-gate, set-variables]
    # Decoupled from the app Docker image: publishes from a full checkout in
    # node:24-alpine so every workspace package's source (including
    # rn-components, which ships TypeScript source rather than dist) is
    # present at pack time. The Docker image only contains runtime-built
    # packages and would publish empty manifests for packages it never COPY'd.
    container:
      image: node:24-alpine
    steps:
      - name: Install git and build tools
        run: apk add --no-cache git python3 make g++
      - uses: actions/checkout@releases/v6
        with:
          ref: ${{ needs.set-variables.outputs.full_sha }}
          fetch-depth: 0
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install
      - name: Detect packages to publish
        id: bumped
        run: |
          # For each publishable package, compare its local version against
          # what is already published on npmjs.org. If the version differs
          # (newer locally, or not yet published), include it in the publish set.
          bumped=""
          for pair in \
            "common:platform/common:@openpeepshq/common" \
            "client:platform/client:@openpeepshq/client" \
            "react:platform/react:@openpeepshq/react" \
            "rn-components:platform/rn-components:@openpeepshq/rn-components" \
            "core:platform/core:@openpeepshq/core" \
            "worker:platform/worker:@openpeepshq/worker" \
            "cli:platform/cli:@openpeepshq/cli" \
            "i18n:platform/i18n:@openpeepshq/i18n" \
            "fetch-client:libraries/fetch-client:@openpeepshq/fetch-client" \
            "greenscreen:libraries/greenscreen:@openpeepshq/greenscreen" \
            "react-ui:libraries/react-ui:@openpeepshq/react-ui" \
            "geocoder:libraries/geocoder:@openpeepshq/geocoder"; do
            short=$(echo "$pair" | cut -d: -f1)
            dir=$(echo "$pair" | cut -d: -f2)
            pkg=$(echo "$pair" | cut -d: -f3)
            local_ver=$(node -p "require('./${dir}/package.json').version")
            registry_ver=$(npm view "$pkg" version 2>/dev/null || echo "not-published")
            if [ "$local_ver" != "$registry_ver" ]; then
              bumped="$bumped $short"
              echo "  $short: ${local_ver} (local) != ${registry_ver} (npm) -> publish"
            else
              echo "  $short: ${local_ver} (already published) -> skip"
            fi
          done
          echo "bumped=${bumped}" >> $FORGEJO_OUTPUT
          echo "Packages to publish: ${bumped:-none}"
      - name: Build bumped publishable libraries
        if: steps.bumped.outputs.bumped != ''
        run: |
          # Build only bumped packages and their dependencies in topological
          # order via deep dependency expansion. rn-components publishes
          # TypeScript source (no dist) and is excluded from the build;
          # its src/ is packed directly during publish.
          build_filters=""
          for pkg in ${{ steps.bumped.outputs.bumped }}; do
            if [ "$pkg" != "rn-components" ]; then
              build_filters="$build_filters --filter @openpeepshq/${pkg}..."
            fi
          done
          if [ -n "$build_filters" ]; then
            eval pnpm "$build_filters" build
          fi
      - name: Publish npm packages
        if: steps.bumped.outputs.bumped != ''
        env:
          # Tokens via env so shell/npmrc do not break on special chars in PATs
          FORGEJO_NPM_TOKEN: ${{ secrets.REGISTRY_PASSWORD }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: |
          set -e
          owner="${{ needs.set-variables.outputs.image_repo }}" && owner="${owner%%/*}"
          forgejo_registry="https://code.openpeeps.org/api/packages/${owner}/npm/"

          publish_filters=""
          for pkg in ${{ steps.bumped.outputs.bumped }}; do
            publish_filters="$publish_filters --filter @openpeepshq/${pkg}"
          done

          # Forgejo package registry (scoped @openpeepshq)
          # https://docs.gitea.com/usage/packages/npm
          {
            echo "@openpeepshq:registry=${forgejo_registry}"
            echo "//code.openpeeps.org/api/packages/${owner}/npm/:_authToken=${FORGEJO_NPM_TOKEN}"
            echo "//code.openpeeps.org/api/packages/${owner}/npm/:always-auth=true"
          } > .npmrc
          eval pnpm -r publish "$publish_filters" --access private --no-git-checks --ignore-scripts

          # npmjs.com (same versions, public scoped packages)
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN secret is required to publish @openpeepshq to npmjs.com" >&2
            exit 1
          fi
          {
            echo "@openpeepshq:registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
            echo "//registry.npmjs.org/:always-auth=true"
          } > .npmrc
          eval pnpm -r publish "$publish_filters" --access public --no-git-checks --ignore-scripts

  deploy-docker:
    runs-on: docker
    needs: [merge-gate, set-variables]
    container:
      image: docker:latest
    steps:
      - name: Docker login
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ vars.REGISTRY_USER }}" --password-stdin "code.openpeeps.org"
      - name: Tag version if on stable
        if: forgejo.ref_name == 'stable'
        run: |
          docker buildx imagetools create \
              --tag "${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.version }}" \
              "${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.short_sha }}"
      - name: Tag tag
        run: |
          docker buildx imagetools create --tag "${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.tag }}" \
            "${{ needs.set-variables.outputs.registry_image_base }}:${{ needs.set-variables.outputs.short_sha }}"
