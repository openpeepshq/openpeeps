# Required secrets: REGISTRY (registry host), REGISTRY_USER, REGISTRY_PASSWORD.
# Set default branch in env or use 'main' below. See .forgejo/README.md for setup.

on:
  push:
  workflow_dispatch:

env:
  DEFAULT_BRANCH: "main"

jobs:
  set-variables:
    runs-on: docker
    steps:
      - id: vars
        run: |
          ref_name="${{ forgejo.ref_name }}"
          sha="${{ forgejo.sha }}"
          short_sha=$(echo "$sha" | cut -c1-8)
          # ref_slug: lowercase, non-alphanumeric -> single dash, max 63 chars
          ref_slug=$(echo "$ref_name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | cut -c1-63)
          if [ "$ref_name" = "${{ env.DEFAULT_BRANCH }}" ]; then
            tag=""
            echo "Running on default branch '${{ env.DEFAULT_BRANCH }}': tag = 'latest'"
          else
            tag=":$ref_slug"
            echo "Running on branch '$ref_name': tag = $tag"
          fi
          version="$(date +%Y-%m-%d)-${short_sha}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "short_sha=$short_sha" >> $GITHUB_OUTPUT
          echo "ref_slug=$ref_slug" >> $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      ref_slug: ${{ steps.vars.outputs.ref_slug }}

  build:
    runs-on: docker
    needs: [set-variables]
    container:
      image: docker:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set image and version
        run: |
          echo "REGISTRY_IMAGE=${{ secrets.REGISTRY }}/${{ forgejo.repository }}" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.set-variables.outputs.short_sha }}" >> $GITHUB_ENV
          echo "VERSION=${{ needs.set-variables.outputs.version }}" >> $GITHUB_ENV
          echo "TAG=${{ needs.set-variables.outputs.tag }}" >> $GITHUB_ENV
      - name: Generate changelog and amend commit (merge into default branch only)
        if: forgejo.ref_name == env.DEFAULT_BRANCH
        run: |
          apk add --no-cache git
          if ! git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            echo "Not a merge commit, skipping changelog generation."
            exit 0
          fi
          docker run --rm -v "$PWD:/app" -w /app node:20 node scripts/generate-changelog.mjs
          if ! git diff --quiet CHANGELOG.md; then
            git remote set-url origin "https://${{ forgejo.actor }}:${{ secrets.REGISTRY_PASSWORD }}@${{ secrets.REGISTRY }}/${{ forgejo.repository }}.git"
            git add CHANGELOG.md
            git commit --amend --no-edit
            git push --force-with-lease origin HEAD
          fi
      - name: Docker login
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USER }}" --password-stdin "${{ secrets.REGISTRY }}"
      - name: Create release tag on stable
        if: forgejo.ref_name == 'stable'
        run: |
          apk add --no-cache git
          git remote set-url origin "https://${{ forgejo.actor }}:${{ secrets.REGISTRY_PASSWORD }}@${{ secrets.REGISTRY }}/${{ forgejo.repository }}.git"
          release_tag="${VERSION}-RELEASE"
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Git tag ${release_tag} already exists. Skipping tag creation."
          else
            git tag "${release_tag}" "${{ forgejo.sha }}"
            git push origin "refs/tags/${release_tag}"
          fi
      - name: Build and push image
        run: |
          if docker manifest inspect "${REGISTRY_IMAGE}:${SHORT_SHA}" >/dev/null 2>&1; then
            echo "Image ${REGISTRY_IMAGE}:${SHORT_SHA} already exists; skipping build."
          else
            docker buildx build --build-arg "VERSION=${VERSION}" --build-arg "ENVIRONMENT=${TAG}" -t "${REGISTRY_IMAGE}:${SHORT_SHA}" --push .
          fi

  test-integration:
    runs-on: docker
    needs: [build, set-variables]
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    services:
      arangodb:
        image: arangodb:3.11
        env:
          ARANGO_NO_AUTH: "true"
      redis:
        image: redis:alpine
      web:
        image: ${{ secrets.REGISTRY }}/${{ forgejo.repository }}:${{ needs.set-variables.outputs.short_sha }}
        credentials:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          DB_URL: "http://arangodb:8529"
          REDIS_HOST: "redis"
          JWT_SECRET: xxx
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm and dependencies
        run: |
          npm i -g pnpm
          cd platform/app
          pnpm install
      - name: Run integration tests
        run: pnpm run test:integration
        working-directory: platform/app

  publish-packages:
    runs-on: docker
    if: forgejo.ref_name == env.DEFAULT_BRANCH
    needs: [test-integration, set-variables]
    container:
      image: ${{ secrets.REGISTRY }}/${{ forgejo.repository }}:${{ needs.set-variables.outputs.short_sha }}
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Publish npm packages
        run: |
          cd /apat
          echo " " >> .npmrc
          # Forgejo npm registry: /api/packages/{owner}/npm/
          owner="${{ forgejo.repository }}" && owner="${owner%%/*}"
          echo "@allpeep:registry=https://${{ secrets.REGISTRY }}/api/packages/${owner}/npm/" >> .npmrc
          echo "//${{ secrets.REGISTRY }}/api/packages/${owner}/npm/:_authToken=${{ secrets.REGISTRY_PASSWORD }}" >> .npmrc
          cat .npmrc
          pnpm install
          pnpm -r publish --access private --no-git-checks

  deploy-docker:
    runs-on: docker
    needs: [test-integration, set-variables]
    container:
      image: docker:latest
    steps:
      - name: Set image and tag
        run: |
          echo "REGISTRY_IMAGE=${{ secrets.REGISTRY }}/${{ forgejo.repository }}" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.set-variables.outputs.short_sha }}" >> $GITHUB_ENV
          echo "VERSION=${{ needs.set-variables.outputs.version }}" >> $GITHUB_ENV
          echo "TAG=${{ needs.set-variables.outputs.tag }}" >> $GITHUB_ENV
      - name: Docker login
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USER }}" --password-stdin "${{ secrets.REGISTRY }}"
      - name: Tag and push (staging/stable)
        if: forgejo.ref_name == 'staging' || forgejo.ref_name == 'stable'
        run: |
          if [ "${{ forgejo.ref_name }}" = "stable" ]; then
            docker buildx imagetools create \
              --tag "${REGISTRY_IMAGE}${TAG}" \
              --tag "${REGISTRY_IMAGE}:${VERSION}" \
              "${REGISTRY_IMAGE}:${SHORT_SHA}"
          else
            docker buildx imagetools create --tag "${REGISTRY_IMAGE}${TAG}" "${REGISTRY_IMAGE}:${SHORT_SHA}"
          fi
      - name: Tag and push (other branches)
        if: forgejo.ref_name != 'staging' && forgejo.ref_name != 'stable'
        run: |
          docker buildx imagetools create --tag "${REGISTRY_IMAGE}${TAG}" "${REGISTRY_IMAGE}:${SHORT_SHA}"
