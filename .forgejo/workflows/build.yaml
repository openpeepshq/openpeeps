on:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      override_sha:
        description: Full commit SHA to build (e.g. after a caller rewrote history); when empty, use the triggering SHA.
        type: string
        required: false
        default: ""

env:
  DEFAULT_BRANCH: "main"
  # Use github.repository: in nested workflow_call runs forgejo.repository can be empty, producing invalid tags like codeberg.org/:sha.
  REGISTRY_IMAGE_BASE: "codeberg.org/${{ github.repository }}"

concurrency:
  group: ${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  set-variables:
    runs-on: docker
    container:
      image: node:24-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout (resolve SHA for workflow_call when forgejo.sha is empty)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ forgejo.token }}
          ref: ${{ inputs.override_sha != '' && inputs.override_sha || forgejo.sha || forgejo.ref }}
      - name: Set variables
        id: vars
        run: |
          ref_name="${{ forgejo.ref_name }}"
          sha="$(git rev-parse HEAD)"
          if [ -z "$sha" ]; then
            echo "Could not resolve commit SHA after checkout." >&2
            exit 1
          fi
          short_sha=$(echo "$sha" | cut -c1-8)
          # ref_slug: lowercase, non-alphanumeric -> single dash, max 63 chars
          ref_slug=$(echo "$ref_name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | cut -c1-63)
          if [ "$ref_name" = "${{ env.DEFAULT_BRANCH }}" ]; then
            tag="latest"
            echo "Running on default branch '${{ env.DEFAULT_BRANCH }}': tag = 'latest'"
          else
            tag="$ref_slug"
            echo "Running on branch '$ref_name': tag = $tag"
          fi
          version="$(date +%Y-%m-%d)-${short_sha}"
          is_release_branch=$(if [ "$ref_name" = "${{ env.DEFAULT_BRANCH }}" ] || [ "$ref_name" = "staging" ] || [ "$ref_name" = "stable" ]; then echo "true"; else echo "false"; fi)
          echo "tag=$tag" >> $FORGEJO_OUTPUT
          echo "version=$version" >> $FORGEJO_OUTPUT
          echo "short_sha=$short_sha" >> $FORGEJO_OUTPUT
          echo "full_sha=$sha" >> $FORGEJO_OUTPUT
          echo "ref_slug=$ref_slug" >> $FORGEJO_OUTPUT
          echo "is_release_branch=$is_release_branch" >> $FORGEJO_OUTPUT
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      full_sha: ${{ steps.vars.outputs.full_sha }}
      ref_slug: ${{ steps.vars.outputs.ref_slug }}
      is_release_branch: ${{ steps.vars.outputs.is_release_branch }}

  build:
    runs-on: docker
    needs: [ set-variables ]
    container:
      image: node:24-alpine
    steps:
      - name: Install Docker CLI and git
        run: apk add --no-cache docker-cli docker-cli-buildx git
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.set-variables.outputs.full_sha }}
          fetch-depth: 0
      - name: Set image and version
        run: |
          echo "REGISTRY_IMAGE=${{ secrets.REGISTRY }}/${{ github.repository }}" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.set-variables.outputs.short_sha }}" >> $GITHUB_ENV
          echo "VERSION=${{ needs.set-variables.outputs.version }}" >> $GITHUB_ENV
          echo "TAG=${{ needs.set-variables.outputs.tag }}" >> $GITHUB_ENV
      - name: Docker login
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ vars.REGISTRY_USER }}" --password-stdin "codeberg.org"
      - name: Create release tag on stable
        if: forgejo.ref_name == 'stable'
        run: |
          git remote set-url origin "https://${{ forgejo.actor }}:${{ forgejo.token }}@codeberg.org/${{ github.repository }}.git"
          release_tag="${VERSION}-RELEASE"
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Git tag ${release_tag} already exists. Skipping tag creation."
          else
            git tag "${release_tag}" "${{ needs.set-variables.outputs.full_sha }}"
            git push origin "refs/tags/${release_tag}"
          fi
      - name: Build and push image
        run: |
          if docker manifest inspect "${{ env.REGISTRY_IMAGE_BASE }}:${{ needs.set-variables.outputs.short_sha }}" >/dev/null 2>&1; then
            echo "Image ${{ env.REGISTRY_IMAGE_BASE }}:${{ needs.set-variables.outputs.short_sha }} already exists; skipping build."
          else
            docker buildx build --build-arg "VERSION=${{ needs.set-variables.outputs.version }}" \
              -t "${{ env.REGISTRY_IMAGE_BASE }}:${{ needs.set-variables.outputs.short_sha }}" --push .
          fi

  test-integration:
    runs-on: docker
    needs: [ build, set-variables ]
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    services:
      arangodb:
        image: arangodb:3.11
        env:
          ARANGO_NO_AUTH: "true"
      redis:
        image: redis:alpine
      web:
        image: ${{ env.REGISTRY_IMAGE_BASE }}:${{ needs.set-variables.outputs.short_sha
          }}
        credentials:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          DB_URL: "http://arangodb:8529"
          REDIS_HOST: "redis"
          JWT_SECRET: xxx
          JAMS_LIVEKIT_API_KEY: APIxxxxxxxxxxxx
          JAMS_LIVEKIT_API_SECRET: xxxxxxxxxxxxx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-variables.outputs.full_sha }}
      - name: Install pnpm and dependencies
        run: |
          npm i -g pnpm
          cd platform/app
          pnpm install
          pnpm exec playwright install chromium chromium-headless-shell
      - name: Run integration tests
        run: pnpm run test:integration
        working-directory: platform/app

  commit-check:
    runs-on: docker
    needs: [ test-integration, set-variables ]
    container:
      image: node:24-alpine
    steps:
      - name: Install git
        if: needs.set-variables.outputs.is_release_branch == 'false'
        run: apk add --no-cache git
      - uses: actions/checkout@v4
        if: needs.set-variables.outputs.is_release_branch == 'false'
        with:
          ref: ${{ needs.set-variables.outputs.full_sha }}
          fetch-depth: 0
      - name: Check commit
        if: needs.set-variables.outputs.is_release_branch == 'false'
        run: |
          git branch main origin/main
          node scripts/check-branch.mjs
      - name: Skip commit check
        if: needs.set-variables.outputs.is_release_branch == 'true'
        run: echo "Skipping commit check on release branch."

  publish-packages:
    runs-on: docker
    if: forgejo.ref_name == env.DEFAULT_BRANCH
    needs: [ commit-check, set-variables ]
    container:
      image: ${{ env.REGISTRY_IMAGE_BASE }}:${{ needs.set-variables.outputs.short_sha
        }}
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Publish npm packages
        env:
          # Pass token via env so `npm config` does not break on $ ` " in the PAT, and to avoid _auth key/registry URL mismatch
          npm_pat: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -e
          cd /apat
          # Forgejo npm: https://docs.gitea.com/usage/packages/npm
          owner="${{ github.repository }}" && owner="${owner%%/*}"
          echo "@openpeeps:registry=https://codeberg.org/api/packages/${owner}/npm/" >> .npmrc
          echo "//codeberg.org/api/packages/${owner}/npm/:_authToken=${{ secrets.REGISTRY_PASSWORD }}" >> .npmrc
          echo "//codeberg.org/api/packages/${owner}/npm/:always-auth=true" >> .npmrc
          cat .npmrc
          pnpm install
          pnpm -r publish --access private --no-git-checks

  deploy-docker:
    runs-on: docker
    needs: [ commit-check, set-variables ]
    container:
      image: docker:latest
    steps:
      - name: Docker login
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ vars.REGISTRY_USER }}" --password-stdin "codeberg.org"
      - name: Tag version if on stable
        if: forgejo.ref_name == 'stable'
        run: |
          docker buildx imagetools create \
              --tag "${{ env.REGISTRY_IMAGE_BASE }}:${{ needs.set-variables.outputs.version }}" \
              "${{ env.REGISTRY_IMAGE_BASE }}:${{ needs.set-variables.outputs.short_sha }}"
      - name: Tag tag
        run: |
          docker buildx imagetools create --tag "${{ env.REGISTRY_IMAGE_BASE }}:${{ needs.set-variables.outputs.tag }}" \
            "${{ env.REGISTRY_IMAGE_BASE }}:${{ needs.set-variables.outputs.short_sha }}"
