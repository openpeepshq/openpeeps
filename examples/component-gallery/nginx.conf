server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /versions.json {
        add_header Cache-Control "no-cache";
        try_files /versions.json =404;
    }

    # Each /{version}/ tree is a React SPA — fall back to that version's index.html.
    location ~ ^/(?<ver>[^/]+)(/.*)?$ {
        try_files $uri $uri/ /$ver/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
