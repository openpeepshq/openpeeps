services:
  postgres:
    restart: always
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openpeeps
      POSTGRES_PASSWORD: openpeeps
      POSTGRES_DB: openpeeps
    ports:
      - "5432:5432"
  redis:
    restart: always
    image: redis:alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      # Reduce disk pressure: OS handles fsync (up to ~30s loss on crash)
      - "--appendfsync"
      - "no"
      # Avoid fsync during AOF rewrite so it doesn't block normal writes
      - "--no-appendfsync-on-rewrite"
      - "yes"
      - "--notify-keyspace-events"
      - "KEA"
    ports:
      - "6379:6379"
