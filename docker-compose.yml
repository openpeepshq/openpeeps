services:
  postgres:
    restart: always
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openpeeps
      POSTGRES_PASSWORD: openpeeps
      POSTGRES_DB: openpeeps
    ports:
      - "5432:5432"
  pgweb:
    restart: unless-stopped
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: postgresql://openpeeps:openpeeps@postgres:5432/openpeeps
    command:
      - pgweb
      - --bind=0.0.0.0
      - --listen=8081
      - --prefix=/_db
    ports:
      - "8081:8081"
    depends_on:
      - postgres
  arango:
    restart: always
    image: arangodb:3.11.8
    environment:
      ARANGO_NO_AUTH: "1"
    ports:
      - "8529:8529"
  redis:
    restart: always
    image: redis:alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      # Reduce disk pressure: OS handles fsync (up to ~30s loss on crash)
      - "--appendfsync"
      - "no"
      # Avoid fsync during AOF rewrite so it doesn't block normal writes
      - "--no-appendfsync-on-rewrite"
      - "yes"
      - "--notify-keyspace-events"
      - "KEA"
    ports:
      - "6379:6379"
