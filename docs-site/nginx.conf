server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/markdown md markdown;
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        image/x-icon ico;
        font/woff2 woff2;
    }
    default_type application/octet-stream;

    location = /versions.json {
        add_header Cache-Control "no-cache";
        try_files /versions.json =404;
    }

    # Raw markdown for LLMs: /{version}/user.md, /{version}/index.md, …
    location ~* \.md$ {
        charset utf-8;
        try_files $uri =404;
    }

    # Each /{version}/ tree is a React SPA — fall back to that version's index.html.
    location ~ ^/(?<ver>[^/]+)(/.*)?$ {
        try_files $uri $uri/ /$ver/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
