# Traefik v3 Static Configuration
# Test harness for ActivityPub federation
#
# TLS termination for the test domains happens here via Traefik. The actual
# TLS certificate + store/options live in dynamic.yml (loaded through the file
# provider) — in Traefik v3 the top-level static `certificates`/`tls` keys are
# no longer parsed, so certs must be configured dynamically.
#
# Certs and CA are generated by setup.sh and mounted from ./certs.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: ap-net
  file:
    filename: /etc/traefik/dynamic.yml

api:
  dashboard: false

log:
  level: "INFO"
  format: "json"

ping:
  entryPoint: "web"
