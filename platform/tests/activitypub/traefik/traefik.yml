# Traefik v3 Static Configuration
# Test harness for ActivityPub federation
#
# TLS termination for the test domains happens here via Traefik. In local mode
# a self-signed CA + wildcard cert (generated by setup.sh) is served via the
# default TLS store configured dynamically in dynamic.yml.
#
# In public mode (`PUBLIC=1`), Traefik's built-in ACME resolver (`le`) obtains
# and renews Let's Encrypt certificates automatically — no external certbot needed.
# Routers in dynamic.yml that carry `tls.certResolver: le` trigger ACME; the HTTP-01
# challenge is answered on the `web` entrypoint (port 80).
#
# NOTE: The Docker provider is intentionally disabled. Traefik v3.0's Docker
# client hardcodes API version 1.24, which Docker 29.x daemons reject
# (minimum 1.40). Instead, all routers/services are defined statically in
# dynamic.yml (file provider) with explicit IPs/ports.

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'

providers:
  file:
    filename: /etc/traefik/dynamic.yml

# ACME certResolver — used only in PUBLIC deployments where routers in
# dynamic.yml specify `tls.certResolver: le`. In local mode the default TLS
# store serves the self-signed cert instead.
certificatesResolvers:
  le:
    acme:
      email: ${ACME_EMAIL}
      storage: /certs/acme.json
      httpChallenge:
        entryPoint: web

api:
  dashboard: false

log:
  level: 'INFO'
  format: 'json'

ping:
  entryPoint: 'web'
