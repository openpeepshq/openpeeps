# ActivityPub federation test harness
#
# Spins up one Mastodon instance and two OpenPeeps instances that federate
# over ActivityPub.
#
# Domains: alpha.<DNS_SUFFIX>, beta.<DNS_SUFFIX>, mastodon.<DNS_SUFFIX>
#   (overridable via .env; default: *.activity-pub.test.ap.social)
#
# TLS: Traefik terminates HTTPS. The default certificate is /certs/tls.crt,
#   produced by setup.sh:
#   - local mode (PUBLIC unset): self-signed CA + wildcard cert
#   - public mode (PUBLIC=1): Traefik ACME (certificatesResolvers.le)
#   The TLS store/options live in traefik/dynamic.yml (dynamic/file provider).
#
# Usage:
#   cd platform/tests/activitypub
#   ./setup.sh                      # start everything + config
#   ./test-federation.sh            # run federation checks
#   docker compose down -v          # tear down

name: ap-test

x-ca-trust: &ca_trust
  NODE_EXTRA_CA_CERTS: /certs/ca.crt

x-extra_hosts: &test_hosts
  - 'alpha.${DNS_SUFFIX:-activity-pub.test.ap.social}:172.50.0.30'
  - 'beta.${DNS_SUFFIX:-activity-pub.test.ap.social}:172.50.0.30'
  - 'mastodon.${DNS_SUFFIX:-activity-pub.test.ap.social}:172.50.0.30'

x-openpeeps-common: &op_common
  JWT_SECRET: ${JWT_SECRET:-test-jwt-secret-change-me}
  AUTO_MIGRATE_FROM_ARANGO: 'false'
  DISABLE_CONFIG_CACHE: 'true'
  RUN_DB_MIGRATE_ON_BOOT: 'false'
  ENVIRONMENT: test
  VERSION: ap-test
  MEDIA_STORAGE_PARAMS_PATH: /tmp/openpeeps-media
  LOGS_LOCAL_PATH: /tmp/openpeeps-logs
  EMAIL_CONFIG_HOST: ${EMAIL_CONFIG_HOST:-mailpit}
  EMAIL_CONFIG_PORT: ${EMAIL_CONFIG_PORT:-1025}
  EMAIL_CONFIG_SECURE: ${EMAIL_CONFIG_SECURE:-false}
  EMAIL_CONFIG_AUTH_USER: ${EMAIL_CONFIG_AUTH_USER:-}
  EMAIL_CONFIG_AUTH_PASS: ${EMAIL_CONFIG_AUTH_PASS:-}
  EMAIL_DEFAULT_FROM: noreply@${DNS_SUFFIX:-activity-pub.test.ap.social}
  SERVER_PROTOCOL: https
  <<: *ca_trust

x-openpeeps-alpha: &op_alpha
  <<: *op_common
  DATABASE_URL: postgresql://openpeeps:openpeeps@postgres:5432/openpeeps_alpha
  REDIS_HOST: redis-alpha
  ACTIVITY_PUB_DEFAULT_DOMAIN: alpha.${DNS_SUFFIX:-activity-pub.test.ap.social}
  SERVER_HOST: alpha.${DNS_SUFFIX:-activity-pub.test.ap.social}

x-openpeeps-beta: &op_beta
  <<: *op_common
  DATABASE_URL: postgresql://openpeeps:openpeeps@postgres:5432/openpeeps_beta
  REDIS_HOST: redis-beta
  ACTIVITY_PUB_DEFAULT_DOMAIN: beta.${DNS_SUFFIX:-activity-pub.test.ap.social}
  SERVER_HOST: beta.${DNS_SUFFIX:-activity-pub.test.ap.social}

x-mastodon: &mastodon_env
  DB_HOST: postgres
  DB_USER: openpeeps
  DB_PASS: openpeeps
  DB_PORT: '5432'
  REDIS_HOST: redis-mastodon
  REDIS_PORT: '6379'
  REDIS_NAMESPACE: mastodon
  RAILS_ENV: production
  LOCAL_HTTPS: 'true'
  TRUSTED_PROXY_IP: 0.0.0.0/0
  DB_SSL: 'false'
  DOMAIN: mastodon.${DNS_SUFFIX:-activity-pub.test.ap.social}
  LOCAL_DOMAIN: mastodon.${DNS_SUFFIX:-activity-pub.test.ap.social}
  SSL_CERT_FILE: /certs/ca.crt
  SMTP_SERVER: ${SMTP_SERVER:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_DOMAIN: ${DNS_SUFFIX:-activity-pub.test.ap.social}
  SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-false}
  SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-none}
  SMTP_LOGIN: ${SMTP_LOGIN:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  # Rails 7.1 (Mastodon 4.3.x) requires encryption keys before db:setup;
  # setup.sh generates and writes these into .env.
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${MASTODON_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${MASTODON_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${MASTODON_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-}
  <<: *ca_trust

networks:
  ap-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.50.0.0/24

volumes:
  pg_data:

services:
  # ────────────────────────────────────────────────────────────────────
  # PostgreSQL — shared, creates per-instance databases via init script
  # ────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    networks:
      ap-net:
        ipv4_address: 172.50.0.10
    environment:
      POSTGRES_USER: openpeeps
      POSTGRES_PASSWORD: openpeeps
      POSTGRES_DB: openpeeps_main
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openpeeps -d openpeeps_main']
      interval: 3s
      timeout: 5s
      retries: 30

  # ────────────────────────────────────────────────────────────────────
  # Redis — one per service to avoid BullMQ queue collisions
  # ────────────────────────────────────────────────────────────────────
  redis-alpha:
    image: redis:7-alpine
    networks:
      ap-net:
        ipv4_address: 172.50.0.20
    command: ['redis-server', '--save', '', '--appendonly', 'no']

  redis-beta:
    image: redis:7-alpine
    networks:
      ap-net:
        ipv4_address: 172.50.0.21
    command: ['redis-server', '--save', '', '--appendonly', 'no']

  redis-mastodon:
    image: redis:7-alpine
    networks:
      ap-net:
        ipv4_address: 172.50.0.22
    command: ['redis-server', '--save', '', '--appendonly', 'no']

  # ────────────────────────────────────────────────────────────────────
  # Mailpit — catch-all SMTP for dev email (bound to the host only)
  # ────────────────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:v1.21
    networks:
      ap-net:
        ipv4_address: 172.50.0.25
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  # ────────────────────────────────────────────────────────────────────
  # Traefik — TLS termination + reverse proxy by Host header
  # Routes are defined statically in traefik/dynamic.yml (file provider)
  # because Traefik v3.0's Docker provider uses API version 1.24, which
  # Docker 29.x daemons reject (minimum 1.40).
  # ────────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    networks:
      ap-net:
        ipv4_address: 172.50.0.30
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs
    # ACME_EMAIL is consumed by traefik.yml certificatesResolvers.le.acme
    # block for PUBLIC deployments. Empty in local mode (no ACME).
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
    extra_hosts: *test_hosts
    depends_on:
      postgres:
        condition: service_healthy
      redis-alpha:
        condition: service_started
      redis-beta:
        condition: service_started
      redis-mastodon:
        condition: service_started

  # ────────────────────────────────────────────────────────────────────
  # OpenPeeps Alpha  (alpha.<DNS_SUFFIX>)
  # ────────────────────────────────────────────────────────────────────
  openpeeps-alpha:
    build:
      context: ../../..
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: test
        VERSION: ap-test
    command: web
    networks:
      ap-net:
        ipv4_address: 172.50.0.40
    volumes:
      - ./certs:/certs
    environment: *op_alpha
    extra_hosts: *test_hosts
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.alpha.rule=Host(`alpha.${DNS_SUFFIX:-activity-pub.test.ap.social}`)'
      - 'traefik.http.routers.alpha.entrypoints=websecure'
      - 'traefik.http.routers.alpha.tls=true'
      - 'traefik.http.services.alpha.loadbalancer.server.port=8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis-alpha:
        condition: service_started

  openpeeps-alpha-worker:
    build:
      context: ../../..
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: test
        VERSION: ap-test
    command: worker
    networks:
      ap-net:
        ipv4_address: 172.50.0.41
    volumes:
      - ./certs:/certs
    environment: *op_alpha
    extra_hosts: *test_hosts
    depends_on:
      openpeeps-alpha:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────────
  # OpenPeeps Beta  (beta.<DNS_SUFFIX>)
  # ────────────────────────────────────────────────────────────────────
  openpeeps-beta:
    build:
      context: ../../..
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: test
        VERSION: ap-test
    command: web
    networks:
      ap-net:
        ipv4_address: 172.50.0.50
    volumes:
      - ./certs:/certs
    environment: *op_beta
    extra_hosts: *test_hosts
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.beta.rule=Host(`beta.${DNS_SUFFIX:-activity-pub.test.ap.social}`)'
      - 'traefik.http.routers.beta.entrypoints=websecure'
      - 'traefik.http.routers.beta.tls=true'
      - 'traefik.http.services.beta.loadbalancer.server.port=8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis-beta:
        condition: service_started

  openpeeps-beta-worker:
    build:
      context: ../../..
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: test
        VERSION: ap-test
    command: worker
    networks:
      ap-net:
        ipv4_address: 172.50.0.51
    volumes:
      - ./certs:/certs
    environment: *op_beta
    extra_hosts: *test_hosts
    depends_on:
      openpeeps-beta:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────────
  # Mastodon  (mastodon.<DNS_SUFFIX>)
  # ────────────────────────────────────────────────────────────────────
  mastodon-web:
    image: tootsuite/mastodon:v4.3.4
    networks:
      ap-net:
        ipv4_address: 172.50.0.60
    volumes:
      - ./certs:/certs
    environment:
      <<: *mastodon_env
      DB_NAME: mastodon_production
      SECRET_KEY_BASE: '${MASTODON_SECRET_KEY_BASE}'
      OTP_SECRET: '${MASTODON_OTP_SECRET}'
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    extra_hosts: *test_hosts
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.mastodon.rule=Host(`mastodon.${DNS_SUFFIX:-activity-pub.test.ap.social}`)'
      - 'traefik.http.routers.mastodon.entrypoints=websecure'
      - 'traefik.http.routers.mastodon.tls=true'
      - 'traefik.http.services.mastodon.loadbalancer.server.port=3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis-mastodon:
        condition: service_started

  mastodon-streaming:
    image: tootsuite/mastodon:v4.3.4
    networks:
      ap-net:
        ipv4_address: 172.50.0.61
    volumes:
      - ./certs:/certs
    environment:
      <<: *mastodon_env
      DB_NAME: mastodon_production
      SECRET_KEY_BASE: '${MASTODON_SECRET_KEY_BASE}'
      OTP_SECRET: '${MASTODON_OTP_SECRET}'
    command: ['npm', 'run', '--', 'start']
    extra_hosts: *test_hosts
    depends_on:
      - mastodon-web

  mastodon-sidekiq:
    image: tootsuite/mastodon:v4.3.4
    networks:
      ap-net:
        ipv4_address: 172.50.0.62
    volumes:
      - ./certs:/certs
    environment:
      <<: *mastodon_env
      DB_NAME: mastodon_production
      SECRET_KEY_BASE: '${MASTODON_SECRET_KEY_BASE}'
      OTP_SECRET: '${MASTODON_OTP_SECRET}'
    command: ['bundle', 'exec', 'sidekiq']
    extra_hosts: *test_hosts
    depends_on:
      - mastodon-web
